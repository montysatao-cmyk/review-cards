<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Review Card Maker</title>
<style>
:root{--bg:#121316;--pn:#1c1e23;--ln:#2e3138;--tx:#f1f1f3;--mu:#a3a7b0;--ac:#00d084}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;padding:12px 12px 90px;max-width:720px}
h1{font-size:20px;margin:6px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:10px 4px;border:1px solid var(--ln);background:var(--pn);color:var(--mu);border-radius:10px;font:inherit}
.tabs button.on{background:var(--ac);color:#06120d;border-color:var(--ac);font-weight:700}
details{background:var(--pn);border:1px solid var(--ln);border-radius:12px;margin-bottom:8px;padding:0 12px}
summary{padding:12px 0;font-weight:600;cursor:pointer}
label{display:block;margin:0 0 10px;color:var(--mu);font-size:13px}
input,select,textarea{width:100%;margin-top:4px;padding:9px;background:#0d0e10;color:var(--tx);border:1px solid var(--ln);border-radius:8px;font:inherit}
textarea{min-height:90px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
canvas,#out{width:100%;height:auto;border-radius:12px;display:block}
#out{display:none;margin-top:10px}
.bar{position:fixed;left:0;right:0;bottom:0;margin:auto;max-width:720px;padding:10px 12px;background:#121316;display:flex;gap:8px}
.bar button{flex:1;padding:13px;border-radius:10px;border:0;font:inherit;font-weight:700}
#save{background:var(--ac);color:#06120d}
#ex{background:var(--pn);color:var(--tx);border:1px solid var(--ln)}
.hint{color:var(--mu);font-size:12px;margin:4px 0 10px}
[hidden]{display:none!important}
</style></head>
<body>
<h1>Review Card Maker</h1>
<div class="tabs" id="tabs"><button data-t="post" class="on">Post</button><button data-t="full">Full review</button><button data-t="ep">Episode</button></div>

<details open><summary>Title details</summary>
<label>Poster (vertical)<input type="file" id="poster" accept="image/*"></label>
<label data-f="post full">Label<input id="fmt" value="🎬 Movie"></label>
<label>Title<input id="title"></label>
<div class="row"><label>Year<input id="year"></label><label>Age rating<input id="age"></label></div>
<div class="row"><label data-f="post full">Runtime<input id="rt"></label><label data-f="post full">Origin<input id="origin"></label></div>
<label>Director<input id="dir"></label>
<label>Handle<input id="handle" value="@yourhandle"></label>
</details>

<details data-f="ep" open><summary>Episode</summary>
<div class="row"><label>Season no.<input id="sn"></label><label>Ep runtime<input id="ert" placeholder="24 min"></label></div>
<div class="row"><label>Episode no.<input id="en"></label><label>Total eps<input id="et"></label></div>
<label>Date watched<input id="edate"></label>
<div class="row"><label>Ep score /10<input id="escore"></label><label>Ep verdict<select id="ev"></select></label></div>
<label>Ep review (short or long)<textarea id="erev"></textarea></label>
</details>

<details data-f="post full" open><summary>Score and tags</summary>
<div class="row"><label>My score /10<input id="score"></label><label>Verdict<select id="v"></select></label></div>
<label>Moctale rating<select id="mr"></select></label>
<label>One-word set (comma separated)<input id="feel"></label>
<label>Chips: genres, source, studio (comma separated)<input id="chips"></label>
</details>

<details data-f="post" open><summary>Short review and potential</summary>
<label>Short review<textarea id="short"></textarea></label>
<div class="row"><label>Potential<select id="pot"></select></label><label>Achieved<select id="ach"></select></label></div>
<label>Size<select id="size"><option value="1350">4:5 (1080×1350)</option><option value="1920">9:16 (1080×1920)</option></select></label>
</details>

<details data-f="full" open><summary>Full review</summary>
<label>Review text<textarea id="full" style="min-height:220px"></textarea></label>
</details>

<details open><summary>Look</summary>
<label>Background<select id="bg"></select></label>
<label>Background image<input type="file" id="bgimg" accept="image/*"></label>
<div class="row"><label>Darkness<input type="range" id="dark" min="0" max="90" value="55"></label><label>Blur<input type="range" id="blur" min="0" max="100" value="75"></label></div>
<p class="hint">Darkness and blur only change the background. Text is always drawn on top at full strength.</p>
</details>

<canvas id="cv" width="1080" height="1350"></canvas>
<img id="out" alt="Generated card">
<p class="hint">If the image doesn't download, press and hold the picture above and choose Save image.</p>
<div class="bar"><button id="ex">Example</button><button id="exp">Export data</button><button id="imp">Import data</button><button id="save">Save image</button></div>
<input type="file" id="impf" accept=".json,application/json" hidden>

<script>
const $=id=>document.getElementById(id);
const MR={'🟣 Perfection':'#a855f7','🟢 Go For It':'#00d084','🟡 Timepass':'#f5b301','🔴 Skip It':'#ff5c7a'};
const VD={'💜 Personal fav':'#ff6fb5','🫡 Respect':'#7c6cff','👍 Liked':'#3b9cff','👎 Didn\'t like':'#fb923c','🗑️ Trash':'#ef4444'};
const POT=['Lowest','Low','Decent','Great','Greatest'],ACH=['Lowest','Lower','Nice','Greater','Greatest'];
const BG={poster:'Blurred poster',custom:'My background image',cinema:'Cinematic',neon:'Neon noir',paper:'Paper (novels)',night:'Plain midnight'};
const W=1080,P=64,IW=W-2*P;
const FF='"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Color Emoji","Apple Color Emoji",sans-serif';
const font=(w,s)=>`${w} ${s}px ${FF}`;
let poster=null,bgimg=null,tab='post';

const lum=h=>{const n=parseInt(h.slice(1),16);return((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000};
const ink=h=>lum(h)>150?'#101114':'#ffffff';
const rr=(c,x,y,w,h,r)=>{c.beginPath();c.roundRect?c.roundRect(x,y,w,h,r):c.rect(x,y,w,h)};
function wrap(c,t,mw){const out=[];(t||'').split('\n').forEach(p=>{if(!p.trim()){out.push('');return}let l='';p.split(/\s+/).forEach(w=>{const n=l?l+' '+w:w;if(c.measureText(n).width>mw&&l){out.push(l);l=w}else l=n});out.push(l)});return out}
function para(c,t,x,y,mw,size,lh,col,w='400'){c.font=font(w,size);c.fillStyle=col;c.textBaseline='top';const L=wrap(c,t,mw);L.forEach((l,i)=>c.fillText(l,x,y+i*lh));return y+L.length*lh}
function chips(c,a,x,y,mw,o){let cx=x,cy=y;c.font=font('600',o.size);a.forEach(t=>{const w=c.measureText(t).width+o.pad*2;if(cx+w>x+mw&&cx>x){cx=x;cy+=o.h+12}rr(c,cx,cy,w,o.h,o.h/2);c.fillStyle=o.bg;c.fill();if(o.stroke){c.strokeStyle=o.stroke;c.lineWidth=2;c.stroke()}c.fillStyle=o.fg;c.textBaseline='middle';c.fillText(t,cx+o.pad,cy+o.h/2+1);cx+=w+12});return a.length?cy+o.h:y}
const panel=(c,x,y,w,h,T)=>{rr(c,x,y,w,h,28);c.fillStyle=T.pn;c.fill();c.strokeStyle=T.ln;c.lineWidth=2;c.stroke()};

function theme(){const k=$('bg').value,light=k=='paper';return{k,light,tx:light?'#231d14':'#ffffff',mu:light?'#5a4f3f':'#d3d6dd',pn:light?'rgba(255,250,240,.82)':'rgba(10,11,14,.62)',ln:light?'#d8ccb4':'#454952'}}

function cover(c,im,w,h,sc){const s=Math.max(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;if(sc<1){const t=document.createElement('canvas');t.width=Math.max(8,im.width*sc|0);t.height=Math.max(8,im.height*sc|0);t.getContext('2d').drawImage(im,0,0,t.width,t.height);im=t}c.imageSmoothingQuality='high';c.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh)}
function bg(c,h,T){const k=T.k;let g;
 if(k=='poster'&&poster||k=='custom'&&bgimg){cover(c,k=='poster'?poster:bgimg,W,h,Math.max(.03,1-$('blur').value/100));c.fillStyle=`rgba(0,0,0,${$('dark').value/100})`;c.fillRect(0,0,W,h)}
 else if(k=='cinema'){g=c.createLinearGradient(0,0,W,h);g.addColorStop(0,'#07262b');g.addColorStop(.55,'#0b0d12');g.addColorStop(1,'#2a0a0d');c.fillStyle=g;c.fillRect(0,0,W,h)}
 else if(k=='neon'){c.fillStyle='#0a0714';c.fillRect(0,0,W,h);[[0,0,'#ff2e9a'],[W,h*.5,'#00e5ff'],[0,h,'#7a3cff']].forEach(([x,y,col])=>{g=c.createRadialGradient(x,y,0,x,y,W*.9);g.addColorStop(0,col+'88');g.addColorStop(1,col+'00');c.fillStyle=g;c.fillRect(0,0,W,h)})}
 else if(k=='paper'){c.fillStyle='#efe4cc';c.fillRect(0,0,W,h);g=c.createRadialGradient(W/2,h/2,W*.3,W/2,h/2,h*.8);g.addColorStop(0,'#f7efdc00');g.addColorStop(1,'#c9b48a66');c.fillStyle=g;c.fillRect(0,0,W,h)}
 else{c.fillStyle='#101218';c.fillRect(0,0,W,h)}}

function pic(c,x,y,w,h){c.save();rr(c,x,y,w,h,24);c.clip();if(poster){const s=Math.max(w/poster.width,h/poster.height);c.drawImage(poster,x+(w-poster.width*s)/2,y+(h-poster.height*s)/2,poster.width*s,poster.height*s)}else{c.fillStyle='#2a2d34';c.fillRect(x,y,w,h)}c.restore()}

function header(c,y,T,ep){const d=id=>$(id).value.trim(),pw=ep?240:300,ph=pw*1.5,x=P+pw+44,mw=W-P-x;pic(c,P,y,pw,ph);let ty=y;
 if(!ep&&d('fmt'))ty=para(c,d('fmt'),x,ty,mw,30,40,T.mu,'600')+6;
 const t=d('title')||'Title';let sz=ep?58:72,L;do{c.font=font('800',sz);L=wrap(c,t,mw);sz-=6}while(L.length>3&&sz>36);
 ty=para(c,t,x,ty,mw,sz+6,(sz+6)*1.12,T.tx,'800')+12;
 const m=ep?['Season '+(d('sn')||'?')+' • Episode '+(d('en')||'?')+'/'+(d('et')||'?'),[d('year'),d('edate')&&'watched '+d('edate')].filter(Boolean).join(' • '),d('ert')&&'Ep runtime: '+d('ert'),d('dir')&&'Directed by '+d('dir')]:[[d('year'),d('rt'),d('age')].filter(Boolean).join(' • '),d('origin'),d('dir')&&'Directed by '+d('dir')];
 m.filter(Boolean).forEach(s=>{ty=para(c,s,x,ty,mw,32,44,T.mu)});
 return Math.max(y+ph,ty)+36}

function hero(c,y,T,sc,cs,acc){panel(c,P,y,IW,210,T);c.textBaseline='alphabetic';c.font=font('800',130);c.fillStyle=acc;const s=sc||'–';c.fillText(s,P+40,y+150);const sw=c.measureText(s).width;c.font=font('600',48);c.fillStyle=T.mu;c.fillText('/10',P+40+sw+10,y+150);
 const n=cs.length,start=y+(210-(n*62+(n-1)*14))/2;
 cs.forEach(([t,col],i)=>{c.font=font('700',34);const w=c.measureText(t).width+56,x=P+IW-40-w,yy=start+i*76;rr(c,x,yy,w,62,31);c.fillStyle=col;c.fill();c.fillStyle=ink(col);c.textBaseline='middle';c.fillText(t,x+28,yy+32)});
 return y+238}

function tags(c,y,T,label,arr,o){if(!arr.length)return y;y=para(c,label,P,y,IW,28,36,T.mu,'600')+8;return chips(c,arr,P,y,IW,o)+28}
function tp(c,y,T,label,text,size,lh){c.font=font('400',size);const L=wrap(c,text||'',IW-80),h=L.length*lh+(label?60:0)+64;panel(c,P,y,IW,h,T);let ty=y+34;if(label)ty=para(c,label,P+40,ty,IW-80,28,34,T.mu,'600')+14;c.font=font('400',size);c.fillStyle=T.tx;c.textBaseline='top';L.forEach((l,i)=>c.fillText(l,P+40,ty+i*lh));return y+h+28}
function pbar(c,y,T,acc){panel(c,P,y,IW,190,T);[['Potential',POT,$('pot').value],['Achieved',ACH,$('ach').value]].forEach(([l,a,v],i)=>{const yy=y+34+i*76,n=a.indexOf(v)+1;c.textBaseline='middle';c.font=font('600',32);c.fillStyle=T.mu;c.fillText(l,P+40,yy+22);for(let j=0;j<5;j++){rr(c,P+260+j*86,yy,74,44,12);c.fillStyle=j<n?acc:T.ln;c.fill()}c.font=font('700',32);c.fillStyle=T.tx;c.fillText(v,P+260+5*86+8,yy+22)});return y+218}
function foot(c,y,T,acc,min){const yy=Math.max(y+10,min-P-44);c.textBaseline='top';c.font=font('700',36);c.fillStyle=acc;c.fillText('●',P,yy+2);c.fillStyle=T.tx;c.fillText($('handle').value.trim(),P+52,yy);return yy+44+P}

function build(c,T){const d=id=>$(id).value.trim(),sp=id=>d(id).split(',').map(x=>x.trim()).filter(Boolean);let y=P;
 if(tab=='ep'){const acc=VD[d('ev')];y=header(c,y,T,1);y=hero(c,y,T,d('escore'),[[d('ev'),acc]],acc);y=tp(c,y,T,'Episode review',d('erev'),40,58);return foot(c,y,T,acc,0)}
 const acc=MR[d('mr')];y=header(c,y,T,0);y=hero(c,y,T,d('score'),[[d('v'),VD[d('v')]],[d('mr'),acc]],acc);
 y=tags(c,y,T,'One-word set',sp('feel'),{size:34,pad:26,h:66,bg:T.pn,fg:T.tx,stroke:acc});
 const ch={size:28,pad:20,h:54,bg:T.pn,fg:T.tx,stroke:T.ln};
 if(tab=='post'){y=tp(c,y,T,'',d('short'),40,58);y=pbar(c,y,T,acc);y=chips(c,sp('chips'),P,y,IW,ch)+(sp('chips').length?28:0);return foot(c,y,T,acc,+$('size').value)}
 y=chips(c,sp('chips'),P,y,IW,ch)+(sp('chips').length?28:0);y=tp(c,y,T,'Review',d('full'),36,54);return foot(c,y,T,acc,0)}

function render(){const T=theme(),H=Math.ceil(build(document.createElement('canvas').getContext('2d'),T)),cv=$('cv');cv.width=W;cv.height=H;const c=cv.getContext('2d');bg(c,H,T);build(c,T)}
let tm;function draw(){clearTimeout(tm);tm=setTimeout(render,120)}
function show(){document.querySelectorAll('[data-f]').forEach(e=>e.hidden=!e.dataset.f.split(' ').includes(tab))}
const load=(inp,cb)=>{inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{cb(i);draw()};i.src=r.result};r.readAsDataURL(f)}};
load($('poster'),i=>poster=i);load($('bgimg'),i=>{bgimg=i;$('bg').value='custom'});

$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x==b));show();draw()};
document.addEventListener('input',draw);
$('save').onclick=()=>{render();$('cv').toBlob(b=>{const u=URL.createObjectURL(b);$('out').src=u;$('out').style.display='block';const a=document.createElement('a');a.href=u;a.download=($('title').value||'review').replace(/\W+/g,'-')+'-'+tab+'.png';a.click()},'image/png')};
$('ex').onclick=()=>{const s={title:'The Furious',year:'2026',age:'18+',rt:'1h 53m',origin:'Chinese',dir:'Kenji Tanigaki',score:'8.75',feel:'Masterclass, Action, Ragebait',chips:'Action, Thriller, Martial Arts, Original',short:'One of the craziest action movies I have seen. Action is insane from the first fight, but a villain scene at the end ragebaited me 🥀',full:'It\'s 1 of the craziest action movies I have seen...\n\nGreat points: It starts with action and goes insane from the 1st action sequence. Straightforward story, minimal dialogue, good pacing. You can see they worked very hard on the fighting styles, choreography and brutality.\n\nFlaws: Few logic issues. Too basic in story. Emotions could have been better. It drags sometimes, even the fights.\n\nOne villain scene at the end ruined my experience, so I dropped my rating to Go For It.',sn:'1',en:'3',et:'12',ert:'24 min',edate:'16 Jul 2026',escore:'8.5',erev:'Sample episode review. Replace this text.'};Object.entries(s).forEach(([k,v])=>$(k).value=v);$('v').value='🫡 Respect';$('mr').value='🟢 Go For It';$('pot').value='Greatest';$('ach').value='Greater';$('ev').value='👍 Liked';draw()};

const IDS=['title','year','age','rt','origin','dir','handle','fmt','score','v','mr','feel','chips','short','pot','ach','size','full','sn','ert','en','et','edate','escore','ev','erev','bg','dark','blur'];
const small=(im,mw,q)=>{if(!im)return null;const s=Math.min(1,mw/im.width),t=document.createElement('canvas');t.width=im.width*s|0;t.height=im.height*s|0;t.getContext('2d').drawImage(im,0,0,t.width,t.height);return t.toDataURL('image/jpeg',q)};
$('exp').onclick=()=>{const o={app:'review-card-maker',tab,f:{},poster:small(poster,700,.85),bgimg:small(bgimg,1080,.75)};IDS.forEach(k=>o.f[k]=$(k).value);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:'application/json'}));a.download=($('title').value||'review').replace(/\W+/g,'-')+'-data.json';a.click()};
$('imp').onclick=()=>$('impf').click();
$('impf').onchange=()=>{const f=$('impf').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);Object.entries(o.f||{}).forEach(([k,v])=>{if($(k))$(k).value=v});poster=null;bgimg=null;const im=(d,cb)=>{if(!d)return;const i=new Image();i.onload=()=>{cb(i);draw()};i.src=d};im(o.poster,i=>poster=i);im(o.bgimg,i=>bgimg=i);const b=document.querySelector('.tabs button[data-t="'+o.tab+'"]');if(b)b.click();draw()}catch(e){alert('That file could not be read.')}};r.readAsText(f);$('impf').value=''};
const opts=(id,a)=>$(id).innerHTML=a.map(x=>`<option>${x}</option>`).join('');
opts('v',Object.keys(VD));opts('ev',Object.keys(VD));opts('mr',Object.keys(MR));opts('pot',POT.slice().reverse());opts('ach',ACH.slice().reverse());
$('bg').innerHTML=Object.entries(BG).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');$('bg').value='cinema';
show();draw();
</script></body></html>
