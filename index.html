<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyCineList</title>
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#090b12">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Dancing+Script:wght@400;700&family=Fira+Code:wght@400;700&family=Kalam:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,400;0,700;1,400;1,700&family=Oswald:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:ital,wght@0,400;0,700;1,400;1,700&family=Special+Elite&display=swap">
<style>
:root{--bg:#090b12;--bg2:#0e1119;--pn:#121623;--pn2:#1a1f2f;--ln:#262c3f;--tx:#f2f4fa;--mu:#96a0b8;--a1:#2f8cff;--a2:#a76bff;--grad:linear-gradient(135deg,#2f8cff,#a76bff);--ok:#19d38a;--bad:#ff6b7d;--nav:66px;--sb:env(safe-area-inset-bottom,0px);--disp:Oswald,"Arial Narrow",system-ui,sans-serif;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--tx);font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 520px at 85% -8%,rgba(96,110,255,.16),transparent 60%),radial-gradient(700px 420px at -10% 0,rgba(167,107,255,.08),transparent 60%),var(--bg);background-attachment:fixed;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}

/* ---------- layout ---------- */
#app{min-height:100dvh;padding-bottom:calc(var(--nav) + var(--sb) + 18px)}
body.nonav #app{padding-bottom:0}
#view{max-width:640px;margin:0 auto;padding:14px 16px 24px}
#view.vin{animation:vin .24s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.h1{font:700 30px/1.1 var(--disp);letter-spacing:.2px;margin:6px 0 4px}
.h2{font:700 20px/1.2 var(--disp);letter-spacing:.2px;margin:0}
.sub{color:var(--mu);font-size:14px;margin:0}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.mt{margin-top:14px}.mt2{margin-top:22px}
.topbar{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.topbar .h2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--ln);background:var(--pn);display:grid;place-items:center;color:var(--tx);flex:none}
.ib:active{background:var(--pn2)}

/* ---------- bottom bar / sidebar ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sb));padding:0 6px var(--sb);background:rgba(11,13,21,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ln);display:flex;justify-content:space-around;align-items:stretch;z-index:30}
body.nonav #nav{display:none}
#nav .brand{display:none}
#nav button{flex:1;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;position:relative;min-width:0}
#nav button.on{color:var(--tx);font-weight:600}
#nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--grad)}
#nav button.add{flex:none;width:64px}
#nav button.add .pl{width:54px;height:54px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;margin-top:-26px;box-shadow:0 8px 24px rgba(112,110,255,.5),0 0 0 5px var(--bg)}
#nav button.add svg{width:26px;height:26px;stroke-width:2.4}
#nav button.add span.lbl{display:none}
@media(min-width:900px){
 #app{padding-left:230px;padding-bottom:0}
 body.nonav #app{padding-left:0}
 #nav{top:0;right:auto;bottom:0;width:230px;height:auto;flex-direction:column;justify-content:flex-start;gap:4px;padding:18px 12px;border-top:0;border-right:1px solid var(--ln)}
 #nav .brand{display:block;order:-2;padding:4px 8px 18px}#nav .brand img{height:34px;width:auto}
 #nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:14px;font-size:15px}
 #nav button.on{background:var(--pn2)}#nav button.on::before{display:none}
 #nav button.add{order:-1;width:auto;background:var(--grad);color:#fff;margin:0 0 10px;font-weight:600}
 #nav button.add .pl{width:auto;height:auto;background:none;margin:0;box-shadow:none;display:contents}
 #nav button.add span.lbl{display:inline}
 #nav button.add svg{width:22px;height:22px}
 #view{max-width:880px;padding:26px 28px 40px}
}

/* ---------- buttons, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--ln);background:var(--pn2);color:var(--tx);font-weight:600}
.btn:active{filter:brightness(1.15)}
.btn.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 6px 20px rgba(112,110,255,.32)}
.btn.bad{color:var(--bad);border-color:rgba(255,107,125,.4)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.lb{display:block;font-size:13px;color:var(--mu);margin:0 0 6px}
.in{width:100%;background:#0b0d15;border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:12px 14px;font:inherit;outline:none}
.in:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(47,140,255,.22)}
textarea.in{min-height:150px;resize:vertical;line-height:1.5}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.fld{margin:0 0 16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.hint{color:var(--mu);font-size:13px;margin:6px 0 0}
.msg{font-size:13px;margin:8px 0;color:var(--mu)}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}

/* chips, segmented, switches */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font-size:14px}
.chip.on{border-color:transparent;background:var(--grad);color:#fff;font-weight:600}
.chip.dim{opacity:.5}
.chip .dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.25)}
.chip.x{padding-right:8px}.chip.x b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);font-weight:400}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.scrollx::-webkit-scrollbar{display:none}
.scrollx .chip{flex:none}
.seg4{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:#0b0d15;border:1px solid var(--ln);border-radius:14px;padding:4px}
.seg4 button{min-height:38px;border:0;border-radius:10px;background:none;color:var(--mu);font-size:14px}
.seg4 button.on{background:var(--pn2);color:var(--tx);font-weight:600;box-shadow:0 0 0 1px var(--ln)}
.sw{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.sw:first-child{border-top:0}
.sw .t{flex:1}.sw .t small{display:block;color:var(--mu);font-size:12.5px}
.tgl{width:50px;height:30px;border-radius:999px;background:var(--ln);position:relative;border:0;flex:none;transition:background .15s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.tgl.on{background:var(--a1)}.tgl.on::after{transform:translateX(20px)}

/* bubbles (the same pills as on the card) */
.bubs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bubs.v5{grid-template-columns:1fr 1fr}
.bub{min-height:52px;border-radius:999px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--tx);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;font-size:15px;transition:transform .12s}
.bub.on{background:var(--c);color:var(--ink);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.bub:active{transform:scale(.97)}
.pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:var(--c);color:var(--ink);font-weight:700;font-size:14px}

/* sliders: the dot reaches both ends */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;margin:0;padding:0;border:0;background:linear-gradient(90deg,var(--a1),var(--a2)) 11px 50%/calc((100% - 22px)*var(--p,.5)) 6px no-repeat,linear-gradient(#2d3347,#2d3347) 11px 50%/calc(100% - 22px) 6px no-repeat;cursor:pointer;touch-action:pan-y;outline:none}
input[type=range]::-webkit-slider-runnable-track{-webkit-appearance:none;height:34px;background:transparent;border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin-top:6px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 5px rgba(0,0,0,.65)}
input[type=range]::-moz-range-track{height:34px;background:transparent;border:0}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 5px rgba(0,0,0,.65)}
.sl{display:flex;align-items:center;gap:12px}.sl input{flex:1}.sl output{min-width:42px;text-align:right;font:700 16px var(--disp)}

/* ---------- welcome ---------- */
#welcome{position:fixed;inset:0;z-index:60;overflow:hidden;background:#05060a}
#welcome .wall{position:absolute;inset:-12% -8%;display:flex;gap:14px;transform:rotate(-9deg) scale(1.12);opacity:.9}
#welcome .col{flex:1;display:flex;flex-direction:column;gap:14px;animation:drift linear infinite;will-change:transform}
#welcome .col:nth-child(even){animation-direction:reverse}
@keyframes drift{from{transform:translateY(0)}to{transform:translateY(-50%)}}
#welcome .pt{aspect-ratio:2/3;border-radius:12px;background-size:cover;background-position:center;flex:none;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#welcome .veil{position:absolute;inset:0;background:radial-gradient(75% 55% at 50% 52%,rgba(5,6,10,.92),rgba(5,6,10,.6) 62%,rgba(5,6,10,.88))}
#welcome .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
#welcome .mid img.wm{height:46px;width:auto}
#welcome .eye{color:#c9b987;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
#welcome h1{font:700 clamp(34px,9vw,56px)/1.04 var(--disp);margin:0;max-width:520px}
#welcome p{color:#b3bbcd;max-width:380px;margin:0}
#welcome .go{margin-top:10px;min-height:54px;padding:0 34px;font-size:17px;border-radius:999px}
.ph-tile{background:linear-gradient(160deg,var(--h1),var(--h2));display:grid;place-items:center;color:rgba(255,255,255,.16)}
.ph-tile svg{width:38%;height:auto;stroke-width:1.2}

/* ---------- home ---------- */
.hello{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.av{width:46px;height:46px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font:700 20px var(--disp);color:#fff;overflow:hidden;flex:none;background-size:cover;background-position:center}
.av.lg{width:78px;height:78px;font-size:32px}
.cta{display:flex;align-items:center;gap:14px;padding:18px;border-radius:20px;background:var(--grad);color:#fff;border:0;width:100%;text-align:left;box-shadow:0 10px 30px rgba(112,110,255,.35)}
.cta .big{font:700 22px/1.1 var(--disp)}.cta small{opacity:.9;display:block;font-size:13px}
.cta .pl{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x proximity;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.strip .tile{flex:none;width:118px;scroll-snap-align:start}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:14px}
.stat b{display:block;font:700 30px/1 var(--disp)}.stat span{color:var(--mu);font-size:13px}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--pn);border:1px solid var(--ln)}
.banner .t{flex:1;font-size:14px}.banner small{display:block;color:var(--mu)}
.empty{text-align:center;padding:34px 18px;border:1px dashed var(--ln);border-radius:20px;color:var(--mu)}
.empty .h2{color:var(--tx);margin-bottom:6px}

/* ---------- library tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{display:block;min-width:0}
.tile .art{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background-size:cover;background-position:center;background-color:var(--pn2);border:1px solid var(--ln)}
.tile .art.gen{display:grid;place-items:center;text-align:center;padding:10px;font:700 20px/1.1 var(--disp);color:rgba(255,255,255,.92);background-image:linear-gradient(160deg,var(--h1),var(--h2))}
.tile .sc{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:rgba(8,10,16,.78);backdrop-filter:blur(6px);font:700 13px var(--disp)}
.tile .sc svg{width:12px;height:12px;color:#f5b301}
.tile .vd{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgba(8,10,16,.78);display:grid;place-items:center;font-size:16px}
.tile .cn{position:absolute;right:8px;top:8px;padding:2px 8px;border-radius:999px;background:var(--a1);font:700 12px var(--disp)}
.tile .tt{margin-top:8px;font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .ts{color:var(--mu);font-size:12.5px;margin-top:2px}
.search{position:relative}.search svg{position:absolute;left:14px;top:13px;color:var(--mu)}.search .in{padding-left:44px}

/* ---------- title page ---------- */
.hero{position:relative;margin:-14px -16px 0;padding:22px 16px 18px;overflow:hidden}
.hero .bd{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(26px) saturate(1.3);opacity:.5;transform:scale(1.15)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,11,18,.1),var(--bg) 96%)}
.hero>*{position:relative;z-index:1}
.hero .top{display:flex;justify-content:space-between;margin-bottom:12px}
.hero .main{display:flex;gap:16px;align-items:flex-end}
.hero .poster{width:116px;aspect-ratio:2/3;border-radius:14px;flex:none;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 34px rgba(0,0,0,.55)}
.hero .poster.gen{display:grid;place-items:center;text-align:center;padding:8px;font:700 18px/1.1 var(--disp);background-image:linear-gradient(160deg,var(--h1),var(--h2))}
.hero .tx{min-width:0}
.hero h1{font:700 28px/1.05 var(--disp);margin:0 0 6px;overflow-wrap:anywhere}
.meta{color:var(--mu);font-size:14px}
.ratings{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.score{display:inline-flex;align-items:center;gap:6px;font:700 28px var(--disp)}.score svg{color:#f5b301;width:22px;height:22px}.score small{font:400 14px system-ui;color:var(--mu)}
.pa{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--ln)}
.rv{display:flex;gap:12px;padding:10px;border-radius:16px;background:var(--pn);border:1px solid var(--ln);align-items:center;width:100%;text-align:left}
.rv img{width:78px;border-radius:10px;flex:none;border:1px solid var(--ln)}
.rv .t{flex:1;min-width:0}.rv b{font:700 18px var(--disp)}
.soon{border:1px dashed var(--ln);border-radius:14px;padding:12px;color:var(--mu);font-size:13px}
.bars .br{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.bars .br .n{width:112px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bars .br .tr{flex:1;height:12px;border-radius:999px;background:var(--ln);overflow:hidden}.bars .br .tr i{display:block;height:100%;border-radius:999px;background:var(--c,var(--a1))}.bars .br .v{width:30px;text-align:right;font:700 15px var(--disp)}

/* ---------- create wizard ---------- */
.wz-top{position:sticky;top:0;z-index:6;background:var(--bg);margin:0 -16px;padding:10px 16px 12px;border-bottom:1px solid var(--ln)}
.wz-top .rowt{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.wz-top .stp{flex:1;min-width:0}.wz-top .stp b{font:700 20px var(--disp);display:block}.wz-top .stp span{color:var(--mu);font-size:12.5px}
.segs{display:flex;gap:5px}.segs button{flex:1;height:22px;border:0;background:none;padding:0;display:flex;align-items:center}
.segs button i{display:block;width:100%;height:4px;border-radius:2px;background:var(--ln)}.segs button.on i{background:var(--grad)}
.wz-body{padding:18px 0 110px}
.wz-foot{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:12px 16px calc(12px + var(--sb));background:linear-gradient(to top,var(--bg) 62%,rgba(9,11,18,0))}
.wz-foot .in-w{max-width:640px;margin:0 auto;display:flex;gap:10px}
.wz-foot .btn{flex:1}.wz-foot .btn.back{flex:none;width:92px}
@media(min-width:900px){.wz-foot{left:0}}
.drop{display:grid;place-items:center;text-align:center;gap:6px;min-height:170px;border:1.5px dashed #3a4260;border-radius:18px;background:rgba(255,255,255,.02);color:var(--mu);padding:18px;cursor:pointer;position:relative;overflow:hidden}
.drop.has{min-height:0;aspect-ratio:2.2/1;background-size:cover;background-position:center;border-style:solid;color:#fff}
.drop.has span{background:rgba(8,10,16,.7);padding:6px 14px;border-radius:999px;font-size:13px}
.tools{display:flex;gap:6px;margin:0 0 8px;overflow-x:auto;scrollbar-width:none}.tools button{flex:none;min-width:42px;height:38px;border-radius:10px;border:1px solid var(--ln);background:var(--pn);font-weight:700}
.tools button.col i{display:block;width:16px;height:16px;border-radius:50%;margin:auto}
.big-score{display:flex;align-items:center;gap:12px;justify-content:center}
.big-score input{width:150px;text-align:center;font:700 44px var(--disp);padding:8px 10px}
.big-score button{width:48px;height:48px;border-radius:50%;border:1px solid var(--ln);background:var(--pn);font-size:24px}
.tpl{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;border:1.5px solid var(--ln);background:var(--pn);width:100%;text-align:left;margin-bottom:8px}
.tpl.on{border-color:var(--a1);box-shadow:0 0 0 3px rgba(47,140,255,.18)}
.tpl.off{opacity:.5}
.tpl .th{width:44px;height:58px;border-radius:8px;background:linear-gradient(160deg,#243a63,#4a2a6e);flex:none}
.tpl b{display:block}.tpl small{color:var(--mu)}
.cv-wrap{border-radius:18px;overflow:hidden;border:1px solid var(--ln);background:#05060a}
.cv-wrap canvas{display:block;width:100%;height:auto}
.sk{min-height:300px;background:linear-gradient(100deg,var(--pn) 30%,var(--pn2) 50%,var(--pn) 70%);background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.acts .btn{flex-direction:column;gap:4px;min-height:60px;font-size:13px;padding:0 6px}

/* ---------- sheets, toast ---------- */
#sheet{position:fixed;inset:0;z-index:80;display:none}
#sheet.on{display:block}
#sheet .bk{position:absolute;inset:0;background:rgba(3,4,8,.62);animation:fadein .18s}
#sheet .pn{position:absolute;left:0;right:0;bottom:0;max-height:92dvh;overflow:auto;background:var(--bg2);border:1px solid var(--ln);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 18px calc(20px + var(--sb));animation:up .22s ease-out;max-width:640px;margin:0 auto}
#sheet .pn.full{top:0;border-radius:0;max-width:none;max-height:none;border:0}
#sheet .gr{width:44px;height:5px;border-radius:3px;background:#3a4260;margin:2px auto 12px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--sb) + 18px);transform:translateX(-50%) translateY(20px);background:#232a40;border:1px solid var(--ln);color:var(--tx);padding:11px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.22s;z-index:90;max-width:90vw;text-align:center}
body.nonav #toast{bottom:calc(96px + var(--sb))}
#toast.on{opacity:1;transform:translateX(-50%)}
.res{display:flex;gap:8px;align-items:center;margin-bottom:10px}.res .in{flex:1;min-width:0}
.prev{padding:14px;background:#0b0d15;border:1px solid var(--ln);border-radius:12px;word-break:break-word}.prev a{color:#6aa9ff;text-decoration:underline}
.list{border:1px solid var(--ln);border-radius:16px;overflow:hidden;background:var(--pn)}
.list>*{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;background:none;border:0;border-top:1px solid var(--ln);text-align:left;min-height:56px}
.list>*:first-child{border-top:0}
.list .t{flex:1;min-width:0}.list small{display:block;color:var(--mu);font-size:12.5px}
.list svg.i{color:var(--mu)}
@media(prefers-reduced-motion:reduce){#welcome .col{animation:none}*{transition:none!important;animation:none!important}}

function brandText(c,T,x,ym,size){
 c.font=font('800',size);c.textBaseline='middle';c.textAlign='left';
 const w1=c.measureText('My').width,w2=c.measureText('Cine').width,w3=c.measureText('List').width;

 const pw=Math.ceil(w2)+24,ph=Math.ceil(size*1.7),t=document.createElement('canvas');t.width=pw;t.height=ph;const g=t.getContext('2d');

 g.fillStyle=gr;g.fillText('Cine',12,ph/2);

/* ---------- review text (Discord-style formatting) ---------- */
function rich(t){const o=[],st={b:0,i:0,s:0,u:0},cs=[];let w='';const fl=()=>{if(w){o.push({w,...st,c:cs[cs.length-1]});w=''}};const pn=/[\s.,!?;:)(]/;
 for(let k=0;k<t.length;k++){const r=t.slice(k);let m;
  if(r.startsWith('**')){fl();st.b^=1;k++}else if(r[0]=='*'){fl();st.i^=1}else if(r.startsWith('__')){fl();st.u^=1;k++}
  else if(r[0]=='_'&&(pn.test(t[k-1]||' ')||pn.test(t[k+1]||' '))){fl();st.i^=1}
  else if(r.startsWith('~~')){fl();st.s^=1;k++}else if(r[0]=='~'){fl();st.s^=1}
  else if(m=r.match(/^\{([#\w(),.%]+):/)){fl();cs.push(m[1]);k+=m[0].length-1}else if(r[0]=='}'&&cs.length){fl();cs.pop()}
  else if(r[0]==' '){fl();o.push({sp:1,...st})}else w+=r[0]}
 fl();return o}

function rlines(c,tk,z,f,mw){const L=[];let ln=[],x=0;tk.forEach(k=>{c.font=fnt(k,z,f);const w=c.measureText(k.sp?' ':k.w).width;if(k.sp){if(ln.length){ln.push({...k,x,wd:w});x+=w}return}if(x+w>mw&&ln.length){while(ln.length&&ln[ln.length-1].sp)ln.pop();L.push(ln);ln=[];x=0}ln.push({...k,x,wd:w});x+=w});L.push(ln);return L}
function rdoc(c,text,z,f,mw){const out=[];let bq=0;(text||'').split('\n').forEach(raw=>{let ln=raw,ind=0,bul=0,q=bq,m;
 if(!bq&&/^>>>\s?/.test(ln)){bq=q=1;ln=ln.replace(/^>>>\s?/,'')}else if(/^>\s/.test(ln)){q=1;ln=ln.slice(2)}
 else if(m=ln.match(/^(\s*)[-*]\s+(.*)$/)){const lv=Math.min(2,m[1].length>>1);bul=lv+1;ind=(lv+1)*38;ln=m[2]}
 const qi=q?26:0,blank=!ln.trim();
 rlines(c,rich(ln),z,f,mw-ind-qi).forEach((l,i)=>out.push({l,ind:ind+qi,bul:i?0:bul,bx:ind,q,blank}))});return out}
function drawLines(c,L,x,y,lh,z,f,col){c.textBaseline='top';c.textAlign='left';let yy=y;
 L.forEach(d=>{const h=d.blank?lh*.55:lh;
  if(d.q){c.save();c.globalAlpha=.45;c.fillStyle=col;c.fillRect(x,yy+2,5,h-4);c.restore()}
  if(d.bul){c.fillStyle=col;c.strokeStyle=col;c.lineWidth=2.5;c.beginPath();c.arc(x+d.bx-22,yy+z*.55,z*.12,0,7);d.bul>1?c.stroke():c.fill()}
  d.l.forEach(k=>{c.font=fnt(k,z,f);c.fillStyle=col;const cc=k.c&&(/^[0-9a-f]{3,8}$/i.test(k.c)?'#'+k.c:k.c);if(cc)c.fillStyle=cc;const xx=x+d.ind+k.x;if(!k.sp)c.fillText(k.w,xx,yy);if(k.s)c.fillRect(xx,yy+z*.58,k.wd,Math.max(2,z/16));if(k.u)c.fillRect(xx,yy+z*1.04,k.wd,Math.max(2,z/18))});
  yy+=h});return yy-y}

/* ---------- storage (IndexedDB, memory fallback) ---------- */
const DB={db:null,mem:{reviews:new Map(),kv:new Map(),imgs:new Map()},persistent:false};
function dbOpen(){return new Promise(res=>{try{const q=indexedDB.open('mcl2',1);
 q.onupgradeneeded=()=>{const d=q.result;d.createObjectStore('reviews',{keyPath:'id'});d.createObjectStore('kv');d.createObjectStore('imgs')};
 q.onsuccess=()=>{DB.db=q.result;DB.persistent=true;res(true)};q.onerror=()=>res(false);q.onblocked=()=>res(false)}catch(e){res(false)}})}
function idb(store,mode,f){return new Promise((res,rej)=>{const t=DB.db.transaction(store,mode),o=t.objectStore(store),r=f(o);t.oncomplete=()=>res(r?r.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const dbGet=(s,k)=>DB.db?idb(s,'readonly',o=>o.get(k)):Promise.resolve(DB.mem[s].get(k));
const dbAll=s=>DB.db?idb(s,'readonly',o=>o.getAll()):Promise.resolve([...DB.mem[s].values()]);
const dbPut=(s,v,k)=>DB.db?idb(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k)):(DB.mem[s].set(k===undefined?v.id:k,v),Promise.resolve());
const dbDel=(s,k)=>DB.db?idb(s,'readwrite',o=>o.delete(k)):(DB.mem[s].delete(k),Promise.resolve());
const kvGet=k=>dbGet('kv',k),kvSet=(k,v)=>dbPut('kv',v,k);

/* ---------- images ---------- */
const imgCache=new Map();
function loadImg(d){if(!d)return Promise.resolve(null);if(imgCache.has(d))return imgCache.get(d);
 const p=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=d});imgCache.set(d,p);if(imgCache.size>10)imgCache.delete(imgCache.keys().next().value);return p}
function fileToData(file,maxW,q,square){return new Promise(res=>{const r=new FileReader();r.onerror=()=>res(null);r.onload=()=>{const i=new Image();i.onerror=()=>res(null);i.onload=()=>{
 let sx=0,sy=0,sw=i.width,sh=i.height;if(square){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m}
 const k=Math.min(1,maxW/sw),c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*k));c.height=Math.max(1,Math.round(sh*k));
 const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,c.width,c.height);g.imageSmoothingQuality='high';g.drawImage(i,sx,sy,sw,sh,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.src=r.result};r.readAsDataURL(file)})}
function pickImage(maxW,q,square){return new Promise(res=>{const f=$('filepick');f.value='';f.onchange=()=>{const file=f.files[0];if(!file){res(null);return}fileToData(file,maxW,q,square).then(res)};f.click()})}
async function shrinkData(d,maxW,q){const i=await loadImg(d);if(!i)return null;const k=Math.min(1,maxW/i.width),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}

/* ---------- drawing a card from data ---------- */
const logoReady=new Promise(r=>{if(MKL.complete&&MKL.naturalWidth)r();else MKL.addEventListener('load',()=>r(),{once:true})});
async function drawCard(cv,x){const R={kind:x.kind,f:x.f,look:x.look,poster:await loadImg(x.poster),bgimg:await loadImg(x.bgimg)};
 await Promise.all([logoReady,fontReady(x.look.rfont)]);renderCard(cv,R);return cv}
async function cardBlob(x,scaleKey){const cv=await drawCard(document.createElement('canvas'),x);const sc=+(scaleKey??x.look.xs)||1;let src=cv;
 if(sc<1){const t=document.createElement('canvas');t.width=Math.round(cv.width*sc);t.height=Math.round(cv.height*sc);const g=t.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(cv,0,0,t.width,t.height);src=t}
 return new Promise(r=>src.toBlob(r,'image/png'))}
async function recData(rec){return{kind:rec.kind,f:rec.f,look:rec.look,poster:rec.hasPoster?await dbGet('imgs',rec.id+':p'):null,bgimg:rec.hasBg?await dbGet('imgs',rec.id+':b'):null}}
const fname=x=>(slug(x.f.title)||'review')+'-'+x.kind+'.png';
function saveBlob(b,name){const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function shareBlob(b,name,title){try{const f=new File([b],name,{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title});else{toast('This browser cannot share pictures. Use Save image.')}}
 catch(e){if(e&&e.name!='AbortError')toast('Could not open the share sheet. Use Save image.')}}

/* ---------- reviews ---------- */
async function saveReview(d){const id=d.id||uid(),now=Date.now();
 const cv=await drawCard(document.createElement('canvas'),d),tw=360,t=document.createElement('canvas');t.width=tw;t.height=Math.round(cv.height*tw/cv.width);
 const g=t.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(cv,0,0,t.width,t.height);
 const rec={id,tkey:tkeyOf(d.f),kind:d.kind,f:{...d.f},look:{...d.look},created:d.created||now,updated:now,thumb:t.toDataURL('image/jpeg',.82),
  pthumb:d.poster?await shrinkData(d.poster,320,.8):null,hasPoster:!!d.poster,hasBg:!!d.bgimg};
 await dbPut('reviews',rec);
 if(d.poster)await dbPut('imgs',d.poster,id+':p');else await dbDel('imgs',id+':p');
 if(d.bgimg)await dbPut('imgs',d.bgimg,id+':b');else await dbDel('imgs',id+':b');
 const k=S.reviews.findIndex(r=>r.id==id);if(k>=0)S.reviews[k]=rec;else S.reviews.push(rec);
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 return rec}
async function deleteReview(id){await dbDel('reviews',id);await dbDel('imgs',id+':p');await dbDel('imgs',id+':b');S.reviews=S.reviews.filter(r=>r.id!=id)}
function groups(){const m=new Map();S.reviews.slice().sort((a,b)=>b.created-a.created).forEach(r=>{if(!m.has(r.tkey))m.set(r.tkey,{key:r.tkey,items:[],latest:r});m.get(r.tkey).items.push(r)});return[...m.values()]}
function stats(){const rs=S.reviews,sc=rs.map(r=>num(r.f.score)).filter(x=>x!=null),now=new Date();
 return{n:rs.length,titles:groups().length,avg:sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:null,
  month:rs.filter(r=>{const d=new Date(r.created);return d.getMonth()==now.getMonth()&&d.getFullYear()==now.getFullYear()}).length}}

function sheet(html,o={}){const s=$('sheet');s.innerHTML=`<div class="bk" data-act="sheet-x"></div><div class="pn ${o.full?'full':''}"><div class="gr"></div>${html}</div>`;s.classList.add('on');sheetClose=o.onClose||null;return s.querySelector('.pn')}
function closeSheet(){const s=$('sheet');s.classList.remove('on');s.innerHTML='';const f=sheetClose;sheetClose=null;if(f)f()}
function ask(title,msg,ok,danger){return new Promise(res=>{let done=false;const fin=v=>{if(done)return;done=true;res(v)};
 const p=sheet(`<h2 class="h2">${esc(title)}</h2><p class="sub mt">${esc(msg)}</p><div class="row mt2"><button class="btn sp" data-k="0">Cancel</button><button class="btn sp ${danger?'bad':'pri'}" data-k="1">${esc(ok)}</button></div>`,{onClose:()=>fin(false)});
 p.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{fin(b.dataset.k=='1');closeSheet()})})}

/* ---------- router ---------- */
const routes={};
function go(p){const h='#'+p;if(location.hash===h)route();else location.hash=p}
function setNav(r){const m={home:'home',library:'library',title:'library',view:'library',insights:'insights',me:'me',tools:'me'}[r];
 $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go==m))}
function buildNav(){$('nav').innerHTML=`<div class="brand"><img src="${WMSRC}" alt="MyCineList"></div>
 <button data-go="home">${ic('home')}<span class="lbl">Home</span></button>
 <button data-go="library">${ic('lib')}<span class="lbl">Library</span></button>
 <button class="add" data-act="new" aria-label="New review"><span class="pl">${ic('plus')}</span><span class="lbl">New review</span></button>
 <button data-go="insights">${ic('chart')}<span class="lbl">Insights</span></button>
 <button data-go="me">${ic('user')}<span class="lbl">Me</span></button>`}
function route(){S.navN=(S.navN||0)+1;const raw=(location.hash||'#/').slice(1),parts=raw.split('/').filter(Boolean),name=parts[0]||'home',arg=parts.slice(1).map(x=>decodeURIComponent(x));
 closeSheet();S.route=name;
 if(name=='welcome'){showWelcome();return}
 if(!S.seen){S.seen=true;kvSet('seen',1).catch(()=>{});if(!parts.length){showWelcome();return}}
 $('welcome').hidden=true;
 const fn=routes[name]||routes.home;document.body.classList.toggle('nonav',name=='create'||name=='view');setNav(name);
 $('view').classList.remove('vin');void $('view').offsetWidth;$('view').classList.add('vin');window.scrollTo(0,0);
 try{fn(...arg)}catch(e){console.error(e);$('view').innerHTML='<div class="empty"><p class="h2">Something went wrong</p><p>Go back and try again.</p></div>'}}
window.addEventListener('hashchange',route);
const setView=h=>{$('view').innerHTML=h};

/* ---------- global click handling ---------- */
const ACT={};
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){e.preventDefault();const t=g.dataset.go;go(t=='home'?'/':'/'+t);return}
 const a=e.target.closest('[data-act]');if(a){const n=a.dataset.act;if(n=='sheet-x'){closeSheet();return}if(ACT[n]){e.preventDefault();ACT[n](a,e)}}});
document.addEventListener('input',e=>{const r=e.target;if(r&&r.type=='range')r.style.setProperty('--p',(r.value-r.min)/(r.max-r.min))});
const syncRanges=(root=document)=>root.querySelectorAll('input[type=range]').forEach(r=>r.style.setProperty('--p',(r.value-r.min)/(r.max-r.min)));
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeSheet()});

const pillHTML=(label,map)=>{const c=(map||{...MR,...VD})[label]||'#8a8f99';return `<span class="pill" style="--c:${c};--ink:${ink(c)}">${esc(emoOf(label))} ${esc(wordOf(label))}</span>`};

/* ---------- welcome ---------- */
function showWelcome(){const w=$('welcome');document.body.classList.add('nonav');
 const real=[...new Set(S.reviews.map(r=>r.pthumb).filter(Boolean))],cols=4,per=6;
 const tiles=[];for(let c=0;c<cols;c++){const col=[];for(let k=0;k<per;k++){const idx=c*per+k;
  if(real.length&&(idx%3!=2||real.length>12))col.push(`<div class="pt" style="background-image:url('${real[(c+k*cols)%real.length]}')"></div>`);
  else{const h=(idx*47+20)%360;col.push(`<div class="pt ph-tile" style="--h1:hsl(${h},42%,24%);--h2:hsl(${(h+50)%360},46%,12%)">${ic('film')}</div>`)}}
  tiles.push(`<div class="col" style="animation-duration:${[70,90,78,104][c]}s">${col.join('')}${col.join('')}</div>`)}
 w.innerHTML=`<div class="wall">${tiles.join('')}</div><div class="veil"></div><div class="mid"><img class="wm" src="${WMSRC}" alt="MyCineList"><span class="eye">Your personal cinema archive</span><h1>Review every film you watch.</h1><p>Make a card for each one, keep them in your own library and see what your taste looks like.</p><button class="btn pri go" data-act="enter">Enter MyCineList</button></div>`;
 w.hidden=false}

/* ---------- home ---------- */
ACT.new=async()=>{if(draftHasContent(S.draft)){const p=sheet(`<h2 class="h2">You have a draft</h2><p class="sub mt">${esc(S.draft.f.title||'Untitled')} is still unfinished.</p><div class="mt2" style="display:grid;gap:10px"><button class="btn pri block" data-k="c">Continue the draft</button><button class="btn block" data-k="n">Start a new review</button></div>`);
  p.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(b.dataset.k=='n'){S.draft=newDraft();saveDraftSoon()}closeSheet();go('/create')});return}
 S.draft=newDraft();saveDraftSoon();go('/create')};
function tile(g){const r=g.latest,sc=num(r.f.score);
 return `<a class="tile" href="#/title/${encodeURIComponent(g.key)}"><div class="art ${r.pthumb?'':'gen'}" style="${r.pthumb?`background-image:url('${r.pthumb}')`:genBg(r.f.title)}">${r.pthumb?'':esc(r.f.title)}${sc!=null?`<span class="sc">${ic('star','f')}${f2n(sc)}</span>`:''}${g.items.length>1?`<span class="cn">×${g.items.length}</span>`:''}${r.f.v?`<span class="vd">${esc(emoOf(r.f.v))}</span>`:''}</div><div class="tt">${esc(r.f.title||'Untitled')}</div><div class="ts">${esc([r.f.year,r.f.fmt].filter(Boolean).join(' · '))}</div></a>`}
routes.home=()=>{const gs=groups(),st=stats(),p=S.profile,d=S.draft,hasD=draftHasContent(d);
 const needB=S.reviews.length>=3&&(!S.lastBackup||Date.now()-S.lastBackup>14*864e5);
 setView(`<div class="hello"><div class="av" ${avStyle()}>${avInit()}</div><div class="sp"><h1 class="h1" style="margin:0">Hi, ${esc(p.name)}</h1><p class="sub">${st.n?`${st.n} review${st.n>1?'s':''} saved`:'Your library is empty'}</p></div></div>
 ${hasD?`<div class="banner mt" style="margin-bottom:12px"><div class="t">Draft: ${esc(d.f.title||'Untitled')}<small>Pick up where you stopped</small></div><button class="btn sm" data-act="cont">Continue</button></div>`:''}
 <button class="cta" data-act="new"><span class="pl">${ic('plus')}</span><span><span class="big">New review</span><small>A card in six quick steps</small></span></button>
 ${gs.length?`<div class="row mt2"><h2 class="h2 sp">Recently reviewed</h2><button class="btn sm" data-go="library">See all</button></div><div class="strip mt">${gs.slice(0,10).map(g=>`<div class="tile">${tile(g)}</div>`).join('')}</div>
  <div class="stats mt2"><div class="stat"><b>${st.n}</b><span>Reviews</span></div><div class="stat"><b>${st.month}</b><span>This month</span></div><div class="stat"><b>${st.avg==null?'–':f2n(st.avg)}</b><span>Average score</span></div><div class="stat"><b>${st.titles}</b><span>Titles</span></div></div>`
  :`<div class="empty mt2"><p class="h2">No reviews yet</p><p>Tap New review to make your first card. Your cards will appear here and in the Library.</p><button class="btn mt" data-go="me">Import a backup</button></div>`}
 ${needB?`<div class="banner mt2"><div class="t">Back up your library<small>${S.lastBackup?'Last backup '+fdate(S.lastBackup):'You have not made a backup yet'}</small></div><button class="btn sm" data-act="export">Back up</button></div>`:''}`)};

/* ---------- library ---------- */
function libItems(){const q=S.lib.q.trim().toLowerCase();let gs=groups();
 if(q)gs=gs.filter(g=>g.items.some(r=>[r.f.title,r.f.dir,r.f.genre,r.f.year,r.f.fmt].join(' ').toLowerCase().includes(q)));
 if(S.lib.v)gs=gs.filter(g=>g.items.some(r=>r.f.v==S.lib.v));
 const sc=g=>num(g.latest.f.score)??-1;
 if(S.lib.sort=='high')gs.sort((a,b)=>sc(b)-sc(a));else if(S.lib.sort=='low')gs.sort((a,b)=>(sc(a)<0?99:sc(a))-(sc(b)<0?99:sc(b)));else if(S.lib.sort=='az')gs.sort((a,b)=>(a.latest.f.title||'').localeCompare(b.latest.f.title||''));
 return gs}
function libGrid(){const gs=libItems();$('libgrid').innerHTML=gs.length?gs.map(tile).join(''):`<div class="empty" style="grid-column:1/-1"><p class="h2">${S.reviews.length?'Nothing matches':'No reviews yet'}</p><p>${S.reviews.length?'Try a different search or clear the filter.':'Make your first card with New review.'}</p></div>`;
 $('libcount').textContent=gs.length+' title'+(gs.length==1?'':'s')}
routes.library=()=>{setView(`<div class="topbar"><h1 class="h1 sp" style="margin:0">Library</h1><span class="sub" id="libcount"></span></div>
 <div class="search"><span>${ic('search')}</span><input class="in" id="libq" placeholder="Search title, director or genre" value="${esc(S.lib.q)}" autocomplete="off"></div>
 <div class="scrollx mt"><button class="chip ${S.lib.v?'':'on'}" data-act="libv" data-v="">All</button>${Object.keys(VD).map(v=>`<button class="chip ${S.lib.v==v?'on':''}" data-act="libv" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>
 <div class="row" style="margin:2px 0 14px"><span class="sub">Sort</span><select class="in" id="libsort" style="width:auto;min-height:40px;padding:8px 36px 8px 12px"><option value="new">Newest</option><option value="high">Highest score</option><option value="low">Lowest score</option><option value="az">A to Z</option></select></div>
 <div class="grid" id="libgrid"></div>`);
 $('libsort').value=S.lib.sort;libGrid();
 $('libq').oninput=e=>{S.lib.q=e.target.value;libGrid()};$('libsort').onchange=e=>{S.lib.sort=e.target.value;libGrid()}};

 setView(`<div class="topbar"><button class="ib" data-act="back" aria-label="Back">${ic('back')}</button><h2 class="h2">${esc(rec.f.title||'Untitled')}</h2></div>

function ghCfg(){let o='',r='review-cards';
 if(/\.github\.io$/i.test(location.hostname)){o=location.hostname.split('.')[0];const g=location.pathname.split('/')[1];r=g&&!/\./.test(g)?g:o+'.github.io'}

const b64=blob=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(blob)});
async function prepImage(file){if(file.size<=4e6)return file;const u=URL.createObjectURL(file);
 const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u});
 const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k|0;c.height=im.height*k|0;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
 return new Promise(r=>c.toBlob(r,'image/jpeg',.9))}
async function ghPut(blob,base){const{o,r,t}=ghCfg();if(!o||!r||!t){const e=new Error('Set up GitHub first: open Me, then Link tools, then GitHub setup.');e.setup=true;throw e}
 const ext=((blob.type||'image/png').split('/')[1]||'png').replace('jpeg','jpg').replace(/[^a-z0-9]/g,'')||'png',
  sl=slug(base).slice(0,40)||'image',path=`img/${sl}-${Date.now().toString(36)}.${ext}`;
 let res;try{res=await fetch(`https://api.github.com/repos/${encodeURIComponent(o)}/${encodeURIComponent(r)}/contents/${path}`,{method:'PUT',headers:{'Authorization':'Bearer '+t,'Accept':'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Add '+path,content:await b64(blob)})})}
 catch(e){throw new Error('Could not reach GitHub. Check your internet and try again.')}
 if(res.status==401)throw new Error('GitHub did not accept the token. It may be wrong or expired.');
 if(res.status==403)throw new Error('The token has no permission to write. It needs Contents: Read and write for this repo.');
 if(res.status==404)throw new Error('GitHub could not find that repo, or the token has no access to it. Check the username and repo name.');
 if(res.status==422)throw new Error('GitHub refused the file (name clash). Try again.');
 if(!res.ok)throw new Error('GitHub said: error '+res.status+'.');
 const j=await res.json();return{page:`https://${o}.github.io/${r.toLowerCase()==(o+'.github.io').toLowerCase()?'':r+'/'}${path}`,raw:(j.content&&j.content.download_url)||`https://raw.githubusercontent.com/${o}/${r}/HEAD/${path}`}}

async function copyText(t){try{await navigator.clipboard.writeText(t);return true}catch(e){}
 const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.appendChild(a);a.select();a.setSelectionRange(0,t.length);let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();return ok}
async function copyRich(url,text){const html=`<a href="${esc(url)}">${esc(text)}</a>`,md=`[${text}](${url})`;
 try{if(window.ClipboardItem&&navigator.clipboard&&navigator.clipboard.write){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([md],{type:'text/plain'})})]);return true}}catch(e){}
 const d=document.createElement('div');d.contentEditable='true';d.innerHTML=html;d.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';document.body.appendChild(d);
 const r=document.createRange();r.selectNodeContents(d);const sl=getSelection();sl.removeAllRanges();sl.addRange(r);let ok=false;try{ok=document.execCommand('copy')}catch(e){}sl.removeAllRanges();d.remove();return ok}

  return `<div class="fld"><label class="lb">Template</label>
  <button class="tpl on" data-act="tpl"><span class="th"></span><span><b>Post card</b><small>Poster, scores, verdict and a short review</small></span></button>
  ${[['Full review','Long text and chips'],['Episode','One episode of a series'],['Anime','Episode scores and season info']].map(x=>`<button class="tpl off" data-act="tpl-soon"><span class="th" style="background:var(--pn2)"></span><span><b>${x[0]}</b><small>${x[1]} · coming soon</small></span></button>`).join('')}
  <p class="hint">Need these today? The <a href="classic.html" style="text-decoration:underline">classic editor</a> still makes them.</p></div>
  <button class="btn block" data-act="wz-peek" style="margin-bottom:18px">${ic('eye')}Preview the card</button>
  <div class="card" style="margin-bottom:16px"><div class="fld"><label class="lb">Theme</label><select class="in" data-l="bg">${Object.entries(TH).map(([k,v])=>`<option value="${k}" ${bg==k?'selected':''}>${esc(v)}</option>`).join('')}</select></div>
  <div id="imgopts" ${['poster','custom'].includes(bg)?'':'hidden'}>${sliderHTML('l','dark',0,90,1,'Darkness')}${sliderHTML('l','blur',0,100,1,'Blur')}</div>
  <div class="fld"><label class="lb">Background picture</label><div class="row"><button class="btn sp" data-act="bgpick">${ic('image')}${S.draft.bgimg?'Change picture':'Choose a picture'}</button>${S.draft.bgimg?`<button class="btn" data-act="bg-rm">Remove</button>`:''}</div><p class="hint">Used by the "My background image" theme.</p></div>
  <div class="fld" style="margin-bottom:0"><label class="lb">Review font</label><select class="in" data-l="rfont">${Object.entries(FONTS).map(([k,v])=>`<option value="${k}" ${wzl('rfont')==k?'selected':''}>${esc(v[0])}</option>`).join('')}</select></div></div>
  <div class="fld"><label class="lb">Review text size</label>${segHTML('rsize',[['30','Small'],['34','Medium'],['40','Large'],['46','Extra']],wzl('rsize'))}</div>
  <div class="fld"><label class="lb">Card size</label>${segHTML('size',[['0','Auto'],['1920','9:16'],['1350','4:5']],wzl('size'))}</div>
  <div class="card" style="margin-bottom:16px"><div class="sw"><span class="t">Thin outline around the review</span><button class="tgl ${lk('outl')?'on':''}" data-act="tgl" data-k="outl" aria-label="Outline"></button></div>
  <div class="sw"><span class="t">RGB glow<small>Soft glow on the bar, logo and bubbles</small></span><button class="tgl ${lk('rgb')?'on':''}" data-act="tgl" data-k="rgb" aria-label="RGB glow"></button></div></div>
  ${hasP?`<div class="card" style="margin-bottom:16px">${sliderHTML('l','ph',320,700,1,'Poster height')}<div class="fld" style="margin-bottom:0"><label class="lb">Poster focus</label>${segHTML('pfocus',[['0','Top'],['.25','Upper'],['.5','Centre'],['1','Bottom']],wzl('pfocus'))}</div></div>`:''}
  ${sliderHTML('l','tsz',30,90,1,'Title size')}
  <div class="fld"><label class="lb" for="wz-handle">Handle on the card</label><input class="in" id="wz-handle" data-f="handle" value="${esc(wzv('handle'))}" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
  <div class="fld"><label class="lb">Saved image width</label>${segHTML('xs',[['1','Full 1080'],['.8','Medium'],['.6','Small']],wzl('xs'))}</div>`},
 /* 6 finish */
 ()=>`<div class="cv-wrap"><div class="sk" id="pvsk"></div><canvas id="pcv" hidden></canvas></div>
  <div class="acts"><button class="btn" data-act="wz-dl">${ic('down')}Save image</button><button class="btn" data-act="wz-share">${ic('share')}Share</button><button class="btn" data-act="wz-link">${ic('link')}Image link</button></div>
  <p class="hint" style="text-align:center">${S.draft.id?'Saving replaces the earlier version of this review.':'Add it to your Library to keep the review and its card.'}</p>`
];
const posterDrop=()=>{const p=S.draft.poster;return `<div class="drop ${p?'has':''}" data-act="poster" role="button" tabindex="0" style="${p?`background-image:url('${p}')`:''}">${p?'<span>Tap to change</span>':`${ic('image')}<span>Tap to add a poster</span>`}</div>${p?'<button class="btn sm" data-act="poster-rm" style="margin-top:10px">Remove poster</button>':''}`};
const genChips=()=>{const gl=genList(),extra=gl.filter(g=>!GENRES.some(x=>x.toLowerCase()==g.toLowerCase()));
 return GENRES.map(g=>`<button class="chip ${gl.some(x=>x.toLowerCase()==g.toLowerCase())?'on':''}" data-act="gen" data-v="${g}">${g}</button>`).join('')+extra.map(g=>`<button class="chip on x" data-act="gen-rm" data-v="${esc(g)}">${esc(g)} <b>×</b></button>`).join('')};
const genHint=()=>{const n=genList().length;return n?`${n} picked. The card shows the first 5.`:'Pick up to five. The card shows the first five.'};
const genRefresh=()=>{$('genchips').innerHTML=genChips();$('genhint').textContent=genHint()};

/* ---------- field binding ---------- */
function wzSet(el){const d=S.draft;if(!d)return;const val=el.type=='checkbox'?el.checked:el.value;
 if(el.dataset.f){const k=el.dataset.f;d.f[k]=val;
  if(k=='score'){const o=el.id=='scs'?$('sci'):$('scs');if(o&&o!==el)o.value=el.id=='scs'?val:(num(val)??0)}
  if(k=='short'){const c=$('cnt');if(c)c.textContent=String(val).length+'/'+MAXREV}}
 else if(el.dataset.l){const k=el.dataset.l;d.look[k]=val;S.look[k]=val;
  if(k=='bg'){const o=$('imgopts');if(o)o.hidden=!['poster','custom'].includes(val)}
  if(k=='rfont')fontReady(val)}
 else return;
 if(el.type=='range'){const o=el.parentElement.querySelector('output');if(o)o.textContent=el.value}
 saveDraftSoon()}
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#wzb'))wzSet(e.target)});
document.addEventListener('change',e=>{const el=e.target;if(!el.closest||!el.closest('#wzb'))return;wzSet(el);
 if(el.id=='sci'){let n=num(el.value);if(el.value.trim()===''){S.draft.f.score='';$('scs').value=0;return}if(n==null)n=0;n=Math.max(0,Math.min(10,n));el.value=f2n(n);S.draft.f.score=el.value;$('scs').value=n;syncRanges($('wzb'));saveDraftSoon()}});
document.addEventListener('keydown',e=>{if(e.key!='Enter')return;const el=e.target;if(el.id=='wz-gen'){e.preventDefault();ACT['gen-add']()}else if(el.id=='wz-title'){e.preventDefault();ACT['wz-next']()}});
document.addEventListener('mousedown',e=>{if(e.target.closest&&e.target.closest('#ftools,#swatches'))e.preventDefault()});

/* ---------- step actions ---------- */
ACT.fmtchip=a=>{S.draft.f.fmt=a.dataset.v;$$('[data-act=fmtchip]').forEach(b=>b.classList.toggle('on',b===a));saveDraftSoon()};
ACT.agechip=a=>{S.draft.f.age=a.dataset.v;$('wz-age').value=a.dataset.v;saveDraftSoon()};
ACT.gen=a=>{const gl=genList(),i=gl.findIndex(x=>x.toLowerCase()==a.dataset.v.toLowerCase());if(i>=0)gl.splice(i,1);else gl.push(a.dataset.v);setGen(gl);genRefresh()};
ACT['gen-rm']=a=>{setGen(genList().filter(x=>x!=a.dataset.v));genRefresh()};
ACT['gen-add']=()=>{const i=$('wz-gen'),t=i.value.trim().replace(/,/g,' ').slice(0,24);if(!t)return;const gl=genList();if(!gl.some(x=>x.toLowerCase()==t.toLowerCase()))gl.push(t);setGen(gl);i.value='';genRefresh()};
ACT.poster=async()=>{const p=await pickImage(1400,.9);if(!p)return;S.draft.poster=p;saveDraftSoon();wzStep(0)};
ACT['poster-rm']=()=>{S.draft.poster=null;saveDraftSoon();wzStep(0)};
ACT['sc-step']=a=>{const n=Math.max(0,Math.min(10,Math.round(((num(wzv('score'))??0)+ +a.dataset.d)*100)/100));S.draft.f.score=f2n(n);$('sci').value=f2n(n);$('scs').value=n;syncRanges($('wzb'));buzz();saveDraftSoon()};
const pick=(k,sel,box,map,a)=>{const v=a.dataset.v;S.draft.f[k]=S.draft.f[k]==v?'':v;$$('#'+box+' .bub').forEach(b=>b.classList.toggle('on',b===a&&S.draft.f[k]==v));buzz();saveDraftSoon()};
ACT.pickv=a=>pick('v','pickv','vb',VD,a);
ACT.pickm=a=>pick('mr','pickm','mb',MR,a);

/* formatting toolbar */
function revSet(v,s,e){const t=$('rv');if(v.length>MAXREV){toast('That would go over '+MAXREV+' characters.');return}t.value=v;t.setSelectionRange(s,e);t.focus();wzSet(t)}
function wrapSel(b,a){const t=$('rv'),s=t.selectionStart,e=t.selectionEnd,v=t.value,sel=v.slice(s,e)||'text';
 revSet(v.slice(0,s)+b+sel+a+v.slice(e),s+b.length,s+b.length+sel.length)}
function prefixLines(p){const t=$('rv'),v=t.value,s=t.selectionStart,e=t.selectionEnd,ls=v.lastIndexOf('\n',s-1)+1;let le=v.indexOf('\n',e);if(le<0)le=v.length;
 const blk=v.slice(ls,le).split('\n').map(l=>l.startsWith(p)?l.slice(p.length):p+l).join('\n');revSet(v.slice(0,ls)+blk+v.slice(le),ls,ls+blk.length)}
ACT.fmt=a=>{if(a.dataset.w)wrapSel(a.dataset.w,a.dataset.w);else prefixLines(a.dataset.p)};
ACT.col=()=>{const s=$('swatches');s.hidden=!s.hidden};
ACT.colset=a=>{wrapSel('{'+a.dataset.c+':','}');$('swatches').hidden=true};

/* style step */
ACT.seg=a=>{const k=a.dataset.k,v=a.dataset.v;S.draft.look[k]=v;S.look[k]=v;a.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===a));saveDraftSoon()};
ACT.tgl=a=>{const k=a.dataset.k,v=!lk(k);S.draft.look[k]=v;S.look[k]=v;a.classList.toggle('on',v);saveDraftSoon()};
ACT.tpl=()=>{};
ACT['tpl-soon']=()=>toast('That template is coming in a later update. The classic editor has it for now.');
ACT.bgpick=async()=>{const p=await pickImage(1400,.8);if(!p)return;S.draft.bgimg=p;S.draft.look.bg='custom';S.look.bg='custom';saveDraftSoon();wzStep(4);toast('Theme set to My background image')};
ACT['bg-rm']=()=>{S.draft.bgimg=null;if(S.draft.look.bg=='custom'){S.draft.look.bg='tint';S.look.bg='tint'}saveDraftSoon();wzStep(4)};
ACT['wz-peek']=async()=>{const d=S.draft;sheet(`<h2 class="h2" style="margin-bottom:12px">Preview</h2><div class="cv-wrap"><div class="sk" id="pksk"></div><canvas id="pkc" hidden></canvas></div><button class="btn block mt" data-act="sheet-x">Close</button>`);
 if(!d.f.title.trim()){const w=$('pksk');if(w)w.innerHTML='<p class="sub" style="padding:20px">Add a title in step 1 to see the card.</p>'}
 try{await drawCard($('pkc'),d);if($('pkc')){$('pksk').hidden=true;$('pkc').hidden=false}}catch(e){console.error(e)}};

/* finish step */
let pvTok=0;
async function wzPreview(){const tok=++pvTok,d=S.draft;try{await drawCard($('pcv'),d);if(tok!=pvTok||!$('pcv'))return;$('pvsk').hidden=true;$('pcv').hidden=false}catch(e){console.error(e)}}
const needTitle=()=>{if(!wzv('title').trim()){toast('Add a title first.');wzStep(0);return true}return false};
ACT['wz-dl']=async()=>{if(needTitle())return;const d=S.draft;saveBlob(await cardBlob(d),fname(d))};
ACT['wz-share']=async()=>{if(needTitle())return;const d=S.draft;shareBlob(await cardBlob(d),fname(d),d.f.title||'Review')};
ACT['wz-link']=async()=>{if(needTitle())return;linkForCard(S.draft)};
ACT['wz-save']=async a=>{if(needTitle())return;const d=S.draft;a.disabled=true;
 try{const rec=await saveReview({id:d.id,kind:d.kind,f:{...d.f,title:d.f.title.trim()},look:d.look,poster:d.poster,bgimg:d.bgimg,created:d.created});
  S.look={...d.look};await kvSet('look',S.look);S.draft=null;await dbDel('kv','draft');
  toast(d.id?'Changes saved':'Added to your Library');go('/title/'+encodeURIComponent(rec.tkey))}
 catch(e){console.error(e);a.disabled=false;toast('Could not save: '+(e&&e.message?e.message:'storage is full or blocked'))}};

/* ---------- boot ---------- */
async function seedFromClassic(){try{const g=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
 const L=JSON.parse(g('mcl.look')||'null'),Dr=JSON.parse(g('mcl.draft')||'null'),p=g('mcl.poster'),b=g('mcl.bgimg');
 if(L){const lk={...S.look};Object.keys(LOOK0).forEach(k=>{if(k in L)lk[k]=L[k]});S.look=lk;await kvSet('look',lk);if(L.handle&&L.handle!='@Monty274')S.profile.handle=L.handle}
 if(Dr&&(Dr.tab=='post'||!Dr.tab)&&(Dr.title||Dr.short)){const f=blankF();Object.keys(f).forEach(k=>{if(k in Dr)f[k]=Dr[k]});if(L&&L.handle)f.handle=L.handle;
  S.draft={id:null,kind:'post',step:0,f,look:{...S.look},poster:p||null,bgimg:b||null,created:null};await kvSet('draft',S.draft)}}catch(e){console.error(e)}}
async function boot(){
 await dbOpen();
 try{const[pr,lk,sn,dr,bk,sd]=await Promise.all([kvGet('profile'),kvGet('look'),kvGet('seen'),kvGet('draft'),kvGet('backup'),kvGet('seeded')]);
  if(pr)S.profile={...S.profile,...pr};if(lk)S.look={...LOOK0,...lk};S.seen=!!sn;S.draft=dr||null;S.lastBackup=bk||null;
  S.reviews=await dbAll('reviews');
  if(!sd&&!S.reviews.length&&!S.draft)await seedFromClassic();
  if(!sd)await kvSet('seeded',1)}catch(e){console.error(e)}
 if(S.draft&&!S.draft.look)S.draft.look={...S.look};
 buildNav();route()}
boot();

</script></body></html>
