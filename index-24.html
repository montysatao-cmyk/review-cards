<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MyCineList</title>
<link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#090b12">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Dancing+Script:wght@400;700&family=Fira+Code:wght@400;700&family=Kalam:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,400;0,700;1,400;1,700&family=Oswald:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:ital,wght@0,400;0,700;1,400;1,700&family=Special+Elite&display=swap">
<style>
:root{--bg:#090b12;--bg2:#0e1119;--pn:#121623;--pn2:#1a1f2f;--ln:#262c3f;--tx:#f2f4fa;--mu:#96a0b8;--a1:#2f8cff;--a2:#a76bff;--grad:linear-gradient(135deg,#2f8cff,#a76bff);--ok:#19d38a;--bad:#ff6b7d;--nav:66px;--sb:env(safe-area-inset-bottom,0px);--disp:Oswald,"Arial Narrow",system-ui,sans-serif;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;color:var(--tx);font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 520px at 85% -8%,rgba(96,110,255,.16),transparent 60%),radial-gradient(700px 420px at -10% 0,rgba(167,107,255,.08),transparent 60%),var(--bg);background-attachment:fixed;min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}

/* ---------- layout ---------- */
#app{min-height:100dvh;padding-bottom:calc(var(--nav) + var(--sb) + 18px)}
body.nonav #app{padding-bottom:0}
#view{max-width:640px;margin:0 auto;padding:14px 16px 24px}
#view.vin{animation:vin .24s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.h1{font:700 30px/1.1 var(--disp);letter-spacing:.2px;margin:6px 0 4px}
.h2{font:700 20px/1.2 var(--disp);letter-spacing:.2px;margin:0}
.sub{color:var(--mu);font-size:14px;margin:0}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.mt{margin-top:14px}.mt2{margin-top:22px}
.topbar{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
.topbar .h2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--ln);background:var(--pn);display:grid;place-items:center;color:var(--tx);flex:none}
.ib:active{background:var(--pn2)}

/* ---------- bottom bar / sidebar ---------- */
#nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sb));padding:0 6px var(--sb);background:rgba(11,13,21,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--ln);display:flex;justify-content:space-around;align-items:stretch;z-index:30}
body.nonav #nav{display:none}
#nav .brand{display:none}
#nav button{flex:1;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;position:relative;min-width:0}
#nav button.on{color:var(--tx);font-weight:600}
#nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--grad)}
#nav button.add{flex:none;width:64px}
#nav button.add .pl{width:54px;height:54px;border-radius:50%;background:var(--grad);display:grid;place-items:center;color:#fff;margin-top:-26px;box-shadow:0 8px 24px rgba(112,110,255,.5),0 0 0 5px var(--bg)}
#nav button.add svg{width:26px;height:26px;stroke-width:2.4}
#nav button.add span.lbl{display:none}
@media(min-width:900px){
 #app{padding-left:230px;padding-bottom:0}
 body.nonav #app{padding-left:0}
 #nav{top:0;right:auto;bottom:0;width:230px;height:auto;flex-direction:column;justify-content:flex-start;gap:4px;padding:18px 12px;border-top:0;border-right:1px solid var(--ln)}
 #nav .brand{display:block;order:-2;padding:4px 8px 18px}#nav .brand img{height:34px;width:auto}
 #nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:14px;font-size:15px}
 #nav button.on{background:var(--pn2)}#nav button.on::before{display:none}
 #nav button.add{order:-1;width:auto;background:var(--grad);color:#fff;margin:0 0 10px;font-weight:600}
 #nav button.add .pl{width:auto;height:auto;background:none;margin:0;box-shadow:none;display:contents}
 #nav button.add span.lbl{display:inline}
 #nav button.add svg{width:22px;height:22px}
 #view{max-width:880px;padding:26px 28px 40px}
}

/* ---------- buttons, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;border:1px solid var(--ln);background:var(--pn2);color:var(--tx);font-weight:600}
.btn:active{filter:brightness(1.15)}
.btn.pri{background:var(--grad);border:0;color:#fff;box-shadow:0 6px 20px rgba(112,110,255,.32)}
.btn.bad{color:var(--bad);border-color:rgba(255,107,125,.4)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.lb{display:block;font-size:13px;color:var(--mu);margin:0 0 6px}
.in{width:100%;background:#0b0d15;border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:12px 14px;font:inherit;outline:none}
.in:focus{border-color:var(--a1);box-shadow:0 0 0 3px rgba(47,140,255,.22)}
textarea.in{min-height:150px;resize:vertical;line-height:1.5}
select.in{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mu) 50%),linear-gradient(135deg,var(--mu) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.fld{margin:0 0 16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:var(--r);padding:14px}
.hint{color:var(--mu);font-size:13px;margin:6px 0 0}
.msg{font-size:13px;margin:8px 0;color:var(--mu)}.msg.err{color:var(--bad)}.msg.ok{color:var(--ok)}

/* chips, segmented, switches */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font-size:14px}
.chip.on{border-color:transparent;background:var(--grad);color:#fff;font-weight:600}
.chip.dim{opacity:.5}
.chip .dot{width:10px;height:10px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.25)}
.chip.x{padding-right:8px}.chip.x b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);font-weight:400}
.scrollx{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}.scrollx::-webkit-scrollbar{display:none}
.scrollx .chip{flex:none}
.seg4{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:#0b0d15;border:1px solid var(--ln);border-radius:14px;padding:4px}
.seg4 button{min-height:38px;border:0;border-radius:10px;background:none;color:var(--mu);font-size:14px}
.seg4 button.on{background:var(--pn2);color:var(--tx);font-weight:600;box-shadow:0 0 0 1px var(--ln)}
.sw{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.sw:first-child{border-top:0}
.sw .t{flex:1}.sw .t small{display:block;color:var(--mu);font-size:12.5px}
.tgl{width:50px;height:30px;border-radius:999px;background:var(--ln);position:relative;border:0;flex:none;transition:background .15s}
.tgl::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.tgl.on{background:var(--a1)}.tgl.on::after{transform:translateX(20px)}

/* bubbles (the same pills as on the card) */
.bubs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bubs.v5{grid-template-columns:1fr 1fr}
.bub{min-height:52px;border-radius:999px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--tx);font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;font-size:15px;transition:transform .12s}
.bub.on{background:var(--c);color:var(--ink);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--c)}
.bub:active{transform:scale(.97)}
.pill{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:var(--c);color:var(--ink);font-weight:700;font-size:14px}

/* sliders: the dot reaches both ends */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;margin:0;padding:0;border:0;background:linear-gradient(90deg,var(--a1),var(--a2)) 11px 50%/calc((100% - 22px)*var(--p,.5)) 6px no-repeat,linear-gradient(#2d3347,#2d3347) 11px 50%/calc(100% - 22px) 6px no-repeat;cursor:pointer;touch-action:pan-y;outline:none}
input[type=range]::-webkit-slider-runnable-track{-webkit-appearance:none;height:34px;background:transparent;border:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;margin-top:6px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 5px rgba(0,0,0,.65)}
input[type=range]::-moz-range-track{height:34px;background:transparent;border:0}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 5px rgba(0,0,0,.65)}
.sl{display:flex;align-items:center;gap:12px}.sl input{flex:1}.sl output{min-width:42px;text-align:right;font:700 16px var(--disp)}

/* ---------- welcome ---------- */
#welcome{position:fixed;inset:0;z-index:60;overflow:hidden;background:#05060a}
#welcome .wall{position:absolute;display:flex;gap:14px;opacity:.9}
#welcome .wall.rows{flex-direction:column}
#welcome .lane{display:flex;flex:none;will-change:transform;animation-timing-function:linear;animation-iteration-count:infinite}
#welcome .wall:not(.rows) .lane{flex-direction:column;animation-name:laneY}
#welcome .wall.rows .lane{flex-direction:row;animation-name:laneX}
#welcome .half{display:flex;flex:none;gap:14px}
#welcome .wall:not(.rows) .half{flex-direction:column;padding-bottom:14px}
#welcome .wall.rows .half{flex-direction:row;padding-right:14px}
@keyframes laneY{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,-50%,0)}}
@keyframes laneX{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
#welcome .pt{width:var(--tw);height:calc(var(--tw)*1.5);border-radius:12px;background-size:cover;background-position:center;box-shadow:0 8px 24px rgba(0,0,0,.45)}
#welcome .veil{position:absolute;inset:0;background:radial-gradient(75% 55% at 50% 52%,rgba(5,6,10,.92),rgba(5,6,10,.6) 62%,rgba(5,6,10,.88))}
#welcome .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
#welcome .mid img.wm{height:46px;width:auto}
#welcome .eye{color:#c9b987;font-size:13px;letter-spacing:.12em;text-transform:uppercase}
#welcome h1{font:700 clamp(34px,9vw,56px)/1.04 var(--disp);margin:0;max-width:520px}
#welcome p{color:#b3bbcd;max-width:380px;margin:0}
#welcome .go{margin-top:10px;min-height:54px;padding:0 34px;font-size:17px;border-radius:999px}
.ph-tile{background:linear-gradient(160deg,var(--h1),var(--h2));display:grid;place-items:center;color:rgba(255,255,255,.16)}
.ph-tile svg{width:38%;height:auto;stroke-width:1.2}

/* ---------- home ---------- */
.hello{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.av{width:46px;height:46px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font:700 20px var(--disp);color:#fff;overflow:hidden;flex:none;background-size:cover;background-position:center}
.av.lg{width:78px;height:78px;font-size:32px}
.cta{display:flex;align-items:center;gap:14px;padding:18px;border-radius:20px;background:var(--grad);color:#fff;border:0;width:100%;text-align:left;box-shadow:0 10px 30px rgba(112,110,255,.35)}
.cta .big{font:700 22px/1.1 var(--disp)}.cta small{opacity:.9;display:block;font-size:13px}
.cta .pl{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.strip{display:flex;gap:12px;overflow-x:auto;padding:4px 0 8px;scroll-snap-type:x proximity;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.strip .tile{flex:none;width:118px;scroll-snap-align:start}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:14px}
.stat b{display:block;font:700 30px/1 var(--disp)}.stat span{color:var(--mu);font-size:13px}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--pn);border:1px solid var(--ln)}
.banner .t{flex:1;font-size:14px}.banner small{display:block;color:var(--mu)}
.empty{text-align:center;padding:34px 18px;border:1px dashed var(--ln);border-radius:20px;color:var(--mu)}
.empty .h2{color:var(--tx);margin-bottom:6px}

/* ---------- library tiles ---------- */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.tile{display:block;min-width:0}
.tile .art{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background-size:cover;background-position:center;background-color:var(--pn2);border:1px solid var(--ln)}
.tile .art.gen{display:grid;place-items:center;text-align:center;padding:10px;font:700 20px/1.1 var(--disp);color:rgba(255,255,255,.92);background-image:linear-gradient(160deg,var(--h1),var(--h2))}
.tile .sc{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;background:rgba(8,10,16,.78);backdrop-filter:blur(6px);font:700 13px var(--disp)}
.tile .sc svg{width:12px;height:12px;color:#f5b301}
.tile .vd{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgba(8,10,16,.78);display:grid;place-items:center;font-size:16px}
.tile .cn{position:absolute;right:8px;top:8px;padding:2px 8px;border-radius:999px;background:var(--a1);font:700 12px var(--disp)}
.tile .tt{margin-top:8px;font-weight:600;font-size:14px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .ts{color:var(--mu);font-size:12.5px;margin-top:2px}
.search{position:relative}.search svg{position:absolute;left:14px;top:13px;color:var(--mu)}.search .in{padding-left:44px}

/* ---------- title page ---------- */
.hero{position:relative;margin:-14px -16px 0;padding:22px 16px 18px;overflow:hidden}
.hero .bd{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(26px) saturate(1.3);opacity:.5;transform:scale(1.15)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,11,18,.1),var(--bg) 96%)}
.hero>*{position:relative;z-index:1}
.hero .top{display:flex;justify-content:space-between;margin-bottom:12px}
.hero .main{display:flex;gap:16px;align-items:flex-end}
.hero .poster{width:116px;aspect-ratio:2/3;border-radius:14px;flex:none;background-size:cover;background-position:center;border:1px solid rgba(255,255,255,.14);box-shadow:0 14px 34px rgba(0,0,0,.55)}
.hero .poster.gen{display:grid;place-items:center;text-align:center;padding:8px;font:700 18px/1.1 var(--disp);background-image:linear-gradient(160deg,var(--h1),var(--h2))}
.hero .tx{min-width:0}
.vpb{position:absolute;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(8,10,16,.82);border:1px solid rgba(255,255,255,.22);color:#fff;cursor:pointer;z-index:2;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.vpb svg{width:16px;height:16px;stroke-width:2.6}
.tile .vpb{left:8px;bottom:8px}.hero .poster{position:relative}.hero .poster .vpb{right:6px;bottom:6px}
.tile .art.gen .vpb{font-size:0}
@media(min-width:900px){.hero{margin:-26px -28px 0;padding:26px 28px 18px;-webkit-mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to right,transparent,#000 28px,#000 calc(100% - 28px),transparent)}}
.hero h1{font:700 28px/1.05 var(--disp);margin:0 0 6px;overflow-wrap:anywhere}
.meta{color:var(--mu);font-size:14px}
.ratings{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.score{display:inline-flex;align-items:center;gap:6px;font:700 28px var(--disp)}.score svg{color:#f5b301;width:22px;height:22px}.score small{font:400 14px system-ui;color:var(--mu)}
.pa{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--ln)}
.rv{display:flex;gap:12px;padding:10px;border-radius:16px;background:var(--pn);border:1px solid var(--ln);align-items:center;width:100%;text-align:left}
.rv img{width:78px;border-radius:10px;flex:none;border:1px solid var(--ln)}
.rv .t{flex:1;min-width:0}.rv b{font:700 18px var(--disp)}
.soon{border:1px dashed var(--ln);border-radius:14px;padding:12px;color:var(--mu);font-size:13px}
.bars .br{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.hist{display:flex;gap:6px;align-items:flex-end;height:130px;margin-top:14px}.hist .hc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}.hist .hc i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--grad);min-height:2px}.hist .hn{font:700 12px var(--disp);color:var(--tx);height:14px}.hist .hl{font-size:11px;color:var(--mu);white-space:nowrap}
.bars .br .n{width:112px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bars .br .tr{flex:1;height:12px;border-radius:999px;background:var(--ln);overflow:hidden}.bars .br .tr i{display:block;height:100%;border-radius:999px;background:var(--c,var(--a1))}.bars .br .v{width:30px;text-align:right;font:700 15px var(--disp)}


/* ---------- 3.5: pickers, selection, banner ---------- */
.pf{position:relative}.pf .in{padding-right:50px}
.pfb{position:absolute;right:0;top:0;bottom:0;width:48px;border:0;background:none;color:var(--mu);display:grid;place-items:center;border-radius:0 14px 14px 0}
.pfsel{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;width:100%;color:var(--tx)}
.pfsel span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pfsel.ph span{color:var(--mu)}.pfsel svg{color:var(--mu);flex:none}
.opts{display:grid;gap:8px}.opts .opt{display:flex;justify-content:space-between;align-items:center;min-height:50px;padding:0 16px;border-radius:14px;border:1.5px solid var(--ln);background:var(--pn);color:var(--tx);font-size:16px;text-align:left;width:100%}
.opts .opt.on{border-color:var(--a1);box-shadow:0 0 0 3px rgba(47,140,255,.18)}.opts .opt small{color:var(--mu);display:block;font-size:13px}
.ygrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-height:52dvh;overflow:auto;padding:2px}
.ygrid button{min-height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font-weight:600}.ygrid button.on{border-color:var(--a1);background:var(--pn2)}
.how{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:12px}.how li{font-size:15px;line-height:1.45}.how code{background:var(--pn2);border:1px solid var(--ln);border-radius:8px;padding:2px 7px;font-size:14px;white-space:nowrap}
.tile.sel .art::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(8,10,16,.28);transition:.12s}
.tile.sel.on .art{border-color:var(--a1);box-shadow:0 0 0 3px var(--a1)}.tile.sel.on .art::after{background:rgba(47,140,255,.2)}

.ck svg{width:15px;height:15px;stroke-width:3.2;color:#fff;opacity:0}.on>.ck,.on .ck{background:var(--a1);border-color:var(--a1)}.on>.ck svg,.on .ck svg{opacity:1}

.wz-top .stp{flex:1;min-width:0}.wz-top .stp b{font:700 20px var(--disp);display:block}.wz-top .stp span{color:var(--mu);font-size:12.5px}

function brandText(c,T,x,ym,size){
 c.font=font('800',size);c.textBaseline='middle';c.textAlign='left';
 const w1=c.measureText('My').width,w2=c.measureText('Cine').width,w3=c.measureText('List').width;
 c.fillStyle=T.tx;c.fillText('My',x,ym);c.fillText('List',x+w1+w2,ym);
 /* "Cine": logo gradient with a shine on the upper right edge */
 const pw=Math.ceil(w2)+24,ph=Math.ceil(size*1.7),t=document.createElement('canvas');t.width=pw;t.height=ph;const g=t.getContext('2d');
 g.font=font('800',size);g.textBaseline='middle';g.textAlign='left';
 const gr=g.createLinearGradient(12,0,12+w2,0);gr.addColorStop(0,'#2f8cff');gr.addColorStop(.5,'#5b8dff');gr.addColorStop(1,'#a76bff');
 g.fillStyle=gr;g.fillText('Cine',12,ph/2);
 g.globalCompositeOperation='source-atop';
 const sx=12+w2*.97,sy=ph/2-size*.34,sh=g.createRadialGradient(sx,sy,0,sx,sy,w2*.36);
 sh.addColorStop(0,'rgba(255,255,255,.95)');sh.addColorStop(.35,'rgba(235,240,255,.42)');sh.addColorStop(1,'rgba(255,255,255,0)');
 g.fillStyle=sh;g.fillRect(0,0,pw,ph);
 c.save();if(RGB){c.shadowColor='#6f8cff';c.shadowBlur=20}c.drawImage(t,x+w1-12,ym-ph/2);c.restore();
 return w1+w2+w3}
function brandLock(c,T,right,ym,size,mh){c.font=font('800',size);const tw=['My','Cine','List'].reduce((a,s)=>a+c.measureText(s).width,0),m=MKL,ok=m.complete&&m.width,mw=ok?m.width/m.height*mh:0,x=right-tw;

function rich(t){const o=[],st={b:0,i:0,s:0,u:0},cs=[];let w='';const fl=()=>{if(w){o.push({w,...st,c:cs[cs.length-1]});w=''}};const pn=/[\s.,!?;:)(]/;
 for(let k=0;k<t.length;k++){const r=t.slice(k);let m;
  if(r.startsWith('**')){fl();st.b^=1;k++}else if(r[0]=='*'){fl();st.i^=1}else if(r.startsWith('__')){fl();st.u^=1;k++}
  else if(r[0]=='_'&&(pn.test(t[k-1]||' ')||pn.test(t[k+1]||' '))){fl();st.i^=1}
  else if(r.startsWith('~~')){fl();st.s^=1;k++}else if(r[0]=='~'){fl();st.s^=1}
  else if(m=r.match(/^\{([#\w(),.%]+):/)){fl();cs.push(m[1]);k+=m[0].length-1}else if(r[0]=='}'&&cs.length){fl();cs.pop()}
  else if(r[0]==' '){fl();o.push({sp:1,...st})}else w+=r[0]}
 fl();return o}

function rlines(c,tk,z,f,mw){const L=[];let ln=[],x=0;tk.forEach(k=>{c.font=fnt(k,z,f);const w=c.measureText(k.sp?' ':k.w).width;if(k.sp){if(ln.length){ln.push({...k,x,wd:w});x+=w}return}if(x+w>mw&&ln.length){while(ln.length&&ln[ln.length-1].sp)ln.pop();L.push(ln);ln=[];x=0}ln.push({...k,x,wd:w});x+=w});L.push(ln);return L}
function rdoc(c,text,z,f,mw){const out=[];let bq=0;(text||'').split('\n').forEach(raw=>{let ln=raw,ind=0,bul=0,q=bq,m;

 else if(m=ln.match(/^(\s*)[-*]\s+(.*)$/)){const lv=Math.min(2,m[1].length>>1);bul=lv+1;ind=(lv+1)*38;ln=m[2]}

function scoresList(){return V('ascores').split(/[\s,;]+/).filter(Boolean).map(Number).filter(v=>isFinite(v))}
function build(c,T,PH,sp){const isEp=D.kind=='ep';let y=hero(c,T,PH,V('title')||'Title')+sp;

 if(D.kind!='post'){const meta=(isEp?[yr,V('edate')&&'Watched '+V('edate')]:[V('origin'),D.kind=='anime'&&V('ascope')]).filter(Boolean).join(dot);if(meta)y=para(c,meta,P,y,IW,27,38,T.mu)+10}
 if(!isEp){const gl=LST('genre').slice(0,5);if(gl.length)y=chipRow(c,gl,P,y,IW,{size:27,pad:24,h:52,bg:T.cb,fg:T.tx,stroke:T.cs})+14;
  if(D.kind!='post'){const ex=LST('chips');if(ex.length)y=chipRow(c,ex,P,y+4,IW,{size:24,pad:20,h:46,bg:null,fg:T.mu,stroke:T.cs})+14}}
 y+=10+sp;
 let sc=V('score');if(!sc&&arr.length)sc=f2(arr.reduce((a,b)=>a+b,0)/arr.length);
 y=ratingsRow(c,T,y,isEp?[{label:'EPISODE SCORE',t:'score',s:V('escore')},{label:'VERDICT',t:'verdict',v:V('ev')}]:[{label:'MOCTALE RATING',t:'mr',mr:V('mr')},{label:'RATING',t:'score',s:sc},{label:'VERDICT',t:'verdict',v:V('v')}])+sp;
 if(D.kind=='anime')y=epChart(c,T,y,arr);
 const rv=D.kind=='full'?V('full'):isEp?V('erev'):V('short');

/* ---------- storage (IndexedDB, memory fallback) ---------- */
const DB={db:null,mem:{reviews:new Map(),kv:new Map(),imgs:new Map()},persistent:false};
function dbOpen(){return new Promise(res=>{try{const q=indexedDB.open('mcl2',1);
 q.onupgradeneeded=()=>{const d=q.result;d.createObjectStore('reviews',{keyPath:'id'});d.createObjectStore('kv');d.createObjectStore('imgs')};
 q.onsuccess=()=>{DB.db=q.result;DB.persistent=true;res(true)};q.onerror=()=>res(false);q.onblocked=()=>res(false)}catch(e){res(false)}})}
function idb(store,mode,f){return new Promise((res,rej)=>{const t=DB.db.transaction(store,mode),o=t.objectStore(store),r=f(o);t.oncomplete=()=>res(r?r.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
const dbGet=(s,k)=>DB.db?idb(s,'readonly',o=>o.get(k)):Promise.resolve(DB.mem[s].get(k));
const dbAll=s=>DB.db?idb(s,'readonly',o=>o.getAll()):Promise.resolve([...DB.mem[s].values()]);
const dbPut=(s,v,k)=>DB.db?idb(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k)):(DB.mem[s].set(k===undefined?v.id:k,v),Promise.resolve());
const dbDel=(s,k)=>DB.db?idb(s,'readwrite',o=>o.delete(k)):(DB.mem[s].delete(k),Promise.resolve());
const kvGet=k=>dbGet('kv',k),kvSet=(k,v)=>dbPut('kv',v,k);

const imgCache=new Map();
function loadImg(d){if(!d)return Promise.resolve(null);if(imgCache.has(d))return imgCache.get(d);
 const p=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=d});imgCache.set(d,p);if(imgCache.size>10)imgCache.delete(imgCache.keys().next().value);return p}
function fileToData(file,maxW,q,square){return new Promise(res=>{const r=new FileReader();r.onerror=()=>res(null);r.onload=()=>{const i=new Image();i.onerror=()=>res(null);i.onload=()=>{
 let sx=0,sy=0,sw=i.width,sh=i.height;if(square){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m}
 const k=Math.min(1,maxW/sw),c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*k));c.height=Math.max(1,Math.round(sh*k));
 const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,c.width,c.height);g.imageSmoothingQuality='high';g.drawImage(i,sx,sy,sw,sh,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};i.src=r.result};r.readAsDataURL(file)})}
function pickImage(maxW,q,square){return new Promise(res=>{const f=$('filepick');f.value='';f.onchange=()=>{const file=f.files[0];if(!file){res(null);return}fileToData(file,maxW,q,square).then(res)};f.click()})}
async function shrinkData(d,maxW,q){const i=await loadImg(d);if(!i)return null;const k=Math.min(1,maxW/i.width),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}

const logoReady=new Promise(r=>{if(MKL.complete&&MKL.naturalWidth)r();else MKL.addEventListener('load',()=>r(),{once:true})});
async function drawCard(cv,x){const R={kind:x.kind,f:x.f,look:x.look,poster:await loadImg(x.poster),bgimg:await loadImg(x.bgimg)};
 await Promise.all([logoReady,fontReady(x.look.rfont)]);renderCard(cv,R);return cv}
async function cardBlob(x,scaleKey){const cv=await drawCard(document.createElement('canvas'),x);const sc=+(scaleKey??x.look.xs)||1;let src=cv;
 if(sc<1){const t=document.createElement('canvas');t.width=Math.round(cv.width*sc);t.height=Math.round(cv.height*sc);const g=t.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(cv,0,0,t.width,t.height);src=t}
 return new Promise(r=>src.toBlob(r,'image/png'))}
async function recData(rec){return{kind:rec.kind,f:rec.f,look:rec.look,poster:rec.hasPoster?await dbGet('imgs',rec.id+':p'):null,bgimg:rec.hasBg?await dbGet('imgs',rec.id+':b'):null}}
const fname=x=>(slug(x.f.title)||'review')+'-'+x.kind+'.png';

async function saveReview(d){const id=d.id||uid(),now=Date.now();
 const cv=await drawCard(document.createElement('canvas'),d),tw=360,t=document.createElement('canvas');t.width=tw;t.height=Math.round(cv.height*tw/cv.width);
 const g=t.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(cv,0,0,t.width,t.height);
 const rec={id,tkey:tkeyOf(d.f),kind:d.kind,f:{...d.f},look:{...d.look},created:d.created||now,updated:d.updated||now,thumb:t.toDataURL('image/jpeg',.82),
  pthumb:d.poster?await shrinkData(d.poster,320,.8):null,hasPoster:!!d.poster,hasBg:!!d.bgimg};
 await dbPut('reviews',rec);
 if(d.poster)await dbPut('imgs',d.poster,id+':p');else await dbDel('imgs',id+':p');
 if(d.bgimg)await dbPut('imgs',d.bgimg,id+':b');else await dbDel('imgs',id+':b');
 const k=S.reviews.findIndex(r=>r.id==id),oldKey=k>=0?S.reviews[k].tkey:null;if(k>=0)S.reviews[k]=rec;else S.reviews.push(rec);
 if(oldKey&&oldKey!=rec.tkey&&!S.reviews.some(r=>r.tkey==oldKey)){if(S.vp[oldKey]){if(!S.vp[rec.tkey])S.vp[rec.tkey]=S.vp[oldKey];delete S.vp[oldKey];kvSet('vposters',S.vp).catch(()=>{})}if(S.bn[oldKey]){if(!S.bn[rec.tkey])S.bn[rec.tkey]=S.bn[oldKey];delete S.bn[oldKey];kvSet('banners',S.bn).catch(()=>{})}if(S.rt[oldKey]){if(!S.rt[rec.tkey])S.rt[rec.tkey]=S.rt[oldKey];delete S.rt[oldKey];kvSet('ratings',S.rt).catch(()=>{})}}
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 return rec}
async function deleteReview(id){await dbDel('reviews',id);await dbDel('imgs',id+':p');await dbDel('imgs',id+':b');const gone=S.reviews.find(r=>r.id==id);S.reviews=S.reviews.filter(r=>r.id!=id);if(gone&&!S.reviews.some(r=>r.tkey==gone.tkey)){if(S.vp[gone.tkey]){delete S.vp[gone.tkey];kvSet('vposters',S.vp).catch(()=>{})}if(S.bn[gone.tkey]){delete S.bn[gone.tkey];kvSet('banners',S.bn).catch(()=>{})}if(S.rt[gone.tkey]){delete S.rt[gone.tkey];kvSet('ratings',S.rt).catch(()=>{})}}}

async function zipStore(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0,cdl=0;
 const n=new Date(),dt=(n.getHours()<<11)|(n.getMinutes()<<5)|(n.getSeconds()>>1),dd=((n.getFullYear()-1980)<<9)|((n.getMonth()+1)<<5)|n.getDate();
 for(const f of files){const data=new Uint8Array(await f.blob.arrayBuffer()),name=enc.encode(f.name),crc=crc32(data);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);
  parts.push(h.buffer,name,data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);

function insFilter(rs,withPeriod){const now=Date.now(),y=new Date().getFullYear();
 return rs.filter(r=>(!S.ins.k||(r.f.fmt||'')==S.ins.k)&&(!withPeriod||S.ins.p=='all'||(S.ins.p=='year'?new Date(r.created).getFullYear()==y:now-r.created<=(+S.ins.p)*864e5)))}
function insBy(rs,by){const m=new Map();
 rs.forEach(r=>{const sc=rScore(r);let ks=[];
  if(by=='genre')ks=String(r.f.genre||'').split(',').map(x=>x.trim()).filter(Boolean);
  else if(by=='dir')ks=String(r.f.dir||'').split(/,|&| and /).map(x=>x.trim()).filter(Boolean);
  else if(by=='year'){const y=String(r.f.year||'').trim();if(y)ks=[y]}
  else{const x=String(r.f.fmt||'').trim();if(x)ks=[x]}
  ks.forEach(k=>{const key=k.toLowerCase();if(!m.has(key))m.set(key,{n:k,c:0,s:0,sc:0});const o=m.get(key);o.c++;if(sc!=null){o.s+=sc;o.sc++}})});
 return[...m.values()].map(o=>({n:o.n,c:o.c,avg:o.sc?o.s/o.sc:null})).sort((a,b)=>b.c-a.c||(b.avg??-1)-(a.avg??-1)||a.n.localeCompare(b.n))}
function insTitleRows(list,gapMode){return list.map(x=>`<a class="rv" href="#/title/${encodeURIComponent(x.key)}" style="padding:8px 12px"><div class="t"><b style="font-size:16px">${esc(x.title||'Untitled')}</b><div class="sub">${esc([x.year,x.fmt].filter(Boolean).join(' · '))}</div></div><span class="score" style="font-size:20px">${gapMode?'−'+f2n(x.sc):ic('star','f')+f2n(x.sc)}</span></a>`).join('')}
function insBody(){const all=S.reviews,rs=insFilter(all,true),el=$('insbody');if(!el)return;
 if(!rs.length){el.innerHTML=`<div class="empty mt"><p class="h2">No reviews here</p><p>Nothing matches this period and format. Try All time or All formats.</p></div>`;return}
 const scs=rs.map(r=>rScore(r)).filter(x=>x!=null).sort((a,b)=>a-b),titles=new Set(rs.map(r=>r.tkey)).size,
  avg=scs.length?scs.reduce((a,b)=>a+b,0)/scs.length:null,med=scs.length?(scs.length%2?scs[(scs.length-1)/2]:(scs[scs.length/2-1]+scs[scs.length/2])/2):null,
  r2=n=>n==null?'–':f2n(Math.round(n*100)/100);
 const hist=Array.from({length:10},(_,i)=>scs.filter(x=>i==9?x>=9:(x>=i&&x<i+1)).length),hm=Math.max(1,...hist);
 const rows=insBy(rs,S.ins.by).slice(0,10),mx=10;
 const vr=Object.keys(VD).map(k=>[k,rs.filter(r=>rVerdict(r)==k).length,VD[k]]),mr=Object.keys(MR).map(k=>[k,rs.filter(r=>r.f.mr==k).length,MR[k]]);
 const pa=rs.filter(r=>r.kind!='ep'&&num(r.f.pot)!=null&&num(r.f.ach)!=null&&String(r.f.pot).trim()!==''&&String(r.f.ach).trim()!==''),
  gap=r=>num(r.f.ach)-num(r.f.pot),over=pa.filter(r=>gap(r)>0).length,met=pa.filter(r=>gap(r)==0).length,short=pa.filter(r=>gap(r)<0).length,
  avp=pa.length?pa.reduce((a,r)=>a+num(r.f.pot),0)/pa.length:null,ava=pa.length?pa.reduce((a,r)=>a+num(r.f.ach),0)/pa.length:null;
 const lat=new Map();rs.slice().sort((a,b)=>b.created-a.created).forEach(r=>{if(!lat.has(r.tkey)&&rScore(r)!=null)lat.set(r.tkey,{key:r.tkey,title:r.f.title,year:r.f.year,fmt:r.f.fmt,sc:rScore(r)})});
 const ranked=[...lat.values()].sort((a,b)=>b.sc-a.sc),kb=Math.min(5,Math.floor(ranked.length/2)),top=ranked.slice(0,Math.min(5,ranked.length-kb)),bot=kb?ranked.slice(-kb).reverse():[];
 const letdown=pa.filter(r=>gap(r)<0).sort((a,b)=>gap(a)-gap(b)).slice(0,3).map(r=>({key:r.tkey,title:r.f.title,year:r.f.year,fmt:r.f.fmt,sc:Math.abs(gap(r))}));
 const now=new Date(),mo=[],kr=insFilter(all,false);for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);mo.push([d.toLocaleDateString('en-GB',{month:'short'}),kr.filter(r=>{const t=new Date(r.created);return t.getMonth()==d.getMonth()&&t.getFullYear()==d.getFullYear()}).length,'#6c7bff'])}
 const best=ranked[0];
 el.innerHTML=`<div class="stats mt"><div class="stat"><b>${rs.length}</b><span>Reviews</span></div><div class="stat"><b>${titles}</b><span>Titles</span></div><div class="stat"><b>${r2(avg)}</b><span>Average score</span></div><div class="stat"><b>${r2(med)}</b><span>Median score</span></div></div>
 ${scs.length?`<div class="card mt"><h2 class="h2">Score distribution</h2><div class="hist">${hist.map((n,i)=>`<div class="hc"><span class="hn">${n||''}</span><i style="height:${n/hm*100}%"></i><span class="hl">${i}${i==9?'–10':''}</span></div>`).join('')}</div><p class="hint" style="margin:6px 0 0">How many reviews fall in each score band (the 9 band is 9 to 10).</p></div>`:''}
 <div class="card mt bars"><h2 class="h2">Scores by</h2><div class="scrollx" style="margin:8px 0 4px">${INS_B.map(([k,n])=>`<button class="chip ${S.ins.by==k?'on':''}" data-act="ins-by" data-v="${k}">${n}</button>`).join('')}</div>
  ${rows.length?rows.map(o=>`<div class="br"><span class="n" style="width:104px">${esc(o.n)}</span><span class="tr"><i style="width:${o.avg==null?0:o.avg/mx*100}%"></i></span><span class="v" style="width:auto;min-width:64px;font-size:14px">${r2(o.avg)} <small style="color:var(--mu);font:400 12px system-ui">×${o.c}</small></span></div>`).join('')+`<p class="hint" style="margin:6px 0 0">Average score, then how many reviews. Most-reviewed first${insBy(rs,S.ins.by).length>10?', top 10 shown':''}.</p>`:`<p class="sub mt">Nothing filled in for this yet.</p>`}</div>
 <div class="card mt"><h2 class="h2">Potential vs achieved</h2>${pa.length?`<div class="stats mt"><div class="stat"><b>${r2(avp)}</b><span>Avg potential</span></div><div class="stat"><b>${r2(ava)}</b><span>Avg achieved</span></div></div>
  <div class="bars">${bars([['Beat potential',over,'#f5b301'],['Met potential',met,'#6c7bff'],['Fell short',short,'#ff5c7a']],Math.max(1,over,met,short))}</div>
  ${letdown.length?`<p class="sub" style="margin:10px 0 6px">Biggest gaps (points short of potential)</p><div style="display:grid;gap:8px">${insTitleRows(letdown,true)}</div>`:''}`:`<p class="sub mt">No reviews with both numbers yet.</p>`}</div>
 ${top.length?`<div class="card mt"><h2 class="h2">Top rated</h2><div class="mt" style="display:grid;gap:8px">${insTitleRows(top)}</div></div>
 ${bot.length?`<div class="card mt"><h2 class="h2">Lowest rated</h2><div class="mt" style="display:grid;gap:8px">${insTitleRows(bot)}</div></div>`:''}`:''}
 <div class="card mt bars"><h2 class="h2">Verdicts</h2>${bars(vr,Math.max(1,...vr.map(x=>x[1])))}</div>
 <div class="card mt bars"><h2 class="h2">Moctale ratings</h2>${bars(mr,Math.max(1,...mr.map(x=>x[1])))}</div>
 <div class="card mt bars"><h2 class="h2">Reviews per month</h2>${bars(mo,Math.max(1,...mo.map(x=>x[1])))}<p class="hint" style="margin:6px 0 0">Last 6 months${S.ins.k?', '+esc(S.ins.k):''}.</p></div>`}

const OLDLOOK=['rfont','rsize','bg','size','tsz','ph','pfocus','dark','blur','xs'];
async function importFile(file){let o;try{o=JSON.parse(await file.text())}catch(e){toast('That file could not be read.');return}
 const jobs=[];
 if(o&&o.app=='mycinelist'&&Array.isArray(o.reviews))o.reviews.forEach(r=>jobs.push({id:r.id,kind:r.kind||'post',f:{...blankF(),...r.f},look:{...LOOK0,...r.look},poster:r.poster||null,bgimg:r.bgimg||null,created:r.created,updated:r.updated}));
 else if(o&&o.app=='review-card-maker'&&o.f){const look={...LOOK0},f={...blankF()};Object.entries(o.f).forEach(([k,v])=>{if(OLDLOOK.includes(k))look[k]=v;else if(k!='feel'&&k!='accent')f[k]=v});
  if(f.mr=='🔴 Skip It')f.mr='🔴 Skip';if(!o.ver)look.bg='tint';if('rgb' in o)look.rgb=!!o.rgb;if('outl' in o)look.outl=!!o.outl;

   Stage 5: sync through a private GitHub repo, offline and install
   ===================================================================== */
Object.assign(IC2,{sync:'M4 12a8 8 0 0 1 14-5.3 M20 4v4h-4 M20 12a8 8 0 0 1-14 5.3 M4 20v-4h4',phone:'M7 3h10v18H7z M11 18h2'});
const SYP='mcl/';
const syCfg=()=>{let c={};try{c=JSON.parse(lsGet('mcl.sync')||'{}')}catch(e){}return{o:c.o||'',r:c.r||'',t:c.t||'',auto:c.auto!==false,dev:c.dev||''}};

const sySave=c=>lsSet('mcl.sync',JSON.stringify(c));
const syInfo=()=>{try{return JSON.parse(lsGet('mcl.synclast')||'{}')}catch(e){return{}}};
const syInfoSet=o=>lsSet('mcl.synclast',JSON.stringify(o));
const SY={running:false,dirty:false,inst:null};
const devName=()=>{let d=lsGet('mcl.dev');if(!d){d=(/Mobi|Android|iPhone|iPad/.test(navigator.userAgent)?'phone':'pc')+'-'+Math.random().toString(36).slice(2,6);lsSet('mcl.dev',d)}return d};

/* ---------- small helpers ---------- */
const enc8=new TextEncoder(),dec8=new TextDecoder();
const u8b64=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const b64u8=b=>{const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u};
async function gitSha(u){const h=enc8.encode('blob '+u.length+'\0'),a=new Uint8Array(h.length+u.length);a.set(h);a.set(u,h.length);
 return[...new Uint8Array(await crypto.subtle.digest('SHA-1',a))].map(x=>x.toString(16).padStart(2,'0')).join('')}
const durl2u8=d=>{const m=/^data:[^;,]+;base64,([\s\S]*)$/.exec(d||'');return m?b64u8(m[1]):null};
const sniffMime=u=>u[0]==0xFF&&u[1]==0xD8?'image/jpeg':u[0]==0x89&&u[1]==0x50?'image/png':u[0]==0x47&&u[1]==0x49?'image/gif':(u[0]==0x52&&u[1]==0x49&&u[8]==0x57)?'image/webp':'image/jpeg';
const u82durl=u=>'data:'+sniffMime(u)+';base64,'+u8b64(u);
const pEnc=k=>encodeURIComponent(k);
async function pool(items,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const k=i++;await fn(items[k],k)}}))}

async function gh(path,o={}){const c=syCfg();let res;
 try{res=await fetch('https://api.github.com'+path,{method:o.method||'GET',cache:'no-store',headers:{Authorization:'Bearer '+c.t,Accept:o.raw?'application/vnd.github.raw+json':'application/vnd.github+json',...(o.body?{'Content-Type':'application/json'}:{})},body:o.body?JSON.stringify(o.body):undefined})}
 catch(e){const x=new Error('Could not reach GitHub. Check your internet connection.');x.net=true;throw x}
 if(res.ok)return o.raw?new Uint8Array(await res.arrayBuffer()):(res.status==204?null:await res.json());
 let j=null;try{j=await res.json()}catch(e){}
 const e=new Error(j&&j.message?j.message:'GitHub error '+res.status);e.status=res.status;e.data=j;
 if(res.status==401)e.message='GitHub did not accept the token. It may be wrong or expired.';
 else if(res.status==403&&/rate limit/i.test(e.message))e.message='GitHub is limiting requests for a while. Try again in a few minutes.';
 else if(res.status==403)e.message='The token has no permission. It needs Contents: Read and write for this repo.';
 else if(res.status==404&&o.repo)e.message='GitHub could not find '+c.o+'/'+c.r+', or the token has no access to it. Check the username, repo name and token.';
 throw e}

async function syRemote(RP,br){let head;
 try{head=await gh(`${RP}/git/ref/heads/${br}`)}catch(e){if(e.status==404||e.status==409)return null;throw e}
 const cm=await gh(`${RP}/git/commits/${head.object.sha}`),tr=await gh(`${RP}/git/trees/${cm.tree.sha}?recursive=1`);
 if(tr.truncated)throw new Error('The sync repo has too many files for this app.');
 const map={};tr.tree.forEach(x=>{if(x.type=='blob'&&x.path.startsWith(SYP))map[x.path]=x.sha});
 return{head:head.object.sha,tree:cm.tree.sha,map}}

/* what this device has, as git blob hashes */
async function syLocal(cache){const L={rev:new Map(),keyed:new Map()};
 for(const rec of S.reviews){const jb=enc8.encode(JSON.stringify(rec)),e={rec,jb,jsha:await gitSha(jb),p:null,b:null};
  let c=cache[rec.id];
  if(!c||c.u!==rec.updated||c.hp!==!!rec.hasPoster||c.hb!==!!rec.hasBg){c={u:rec.updated,hp:!!rec.hasPoster,hb:!!rec.hasBg,p:null,b:null};
   for(const k of ['p','b']){if(!(k=='p'?rec.hasPoster:rec.hasBg))continue;const u=durl2u8(await dbGet('imgs',rec.id+':'+k));if(u)c[k]=await gitSha(u)}
   cache[rec.id]=c}
  e.p=c.p;e.b=c.b;L.rev.set(rec.id,e)}
 Object.keys(cache).forEach(id=>{if(!L.rev.has(id))delete cache[id]});
 const add=async(path,u8)=>{L.keyed.set(path,{sha:await gitSha(u8),u8})};
 for(const[k,d]of Object.entries(S.vp)){const u=durl2u8(d);if(u)await add(`${SYP}v/${pEnc(k)}.img`,u)}
 for(const[k,d]of Object.entries(S.bn)){const u=durl2u8(d);if(u)await add(`${SYP}n/${pEnc(k)}.img`,u)}
 for(const[k,v]of Object.entries(S.rt))await add(`${SYP}t/${pEnc(k)}.json`,enc8.encode(JSON.stringify(v)));
 await add(SYP+'profile.json',enc8.encode(JSON.stringify({name:S.profile.name,handle:S.profile.handle,avatar:S.profile.avatar||null,ui:S.profile.ui?uiOut(uiNorm(S.profile.ui)):null})));
 return L}

/* l = this device, r = the repo, b = what we both had at the last sync */
const plan3=(l,r,b)=>l&&r?(l===r?'none':b===r?'push':b===l?'pull':'conflict'):l?(b&&l===b?'delpull':'push'):r?(b&&r===b?'delpush':'pull'):'none';
const syRid=p=>decodeURIComponent(p.slice((SYP+'r/').length,-5));
const syKey=p=>{const m=/^mcl\/(v|n|t)\/(.+)\.(img|json)$/.exec(p);return m?{kind:m[1],key:decodeURIComponent(m[2])}:null};

async function syncNow(opt={}){if(SY.running)return null;SY.running=true;SY.dirty=false;
 const prog=m=>say('sprog',m),sum={up:0,down:0,delL:0,delR:0,conf:0,k:0};
 try{
  if(!syReady())throw new Error('Set up sync first.');
  if(!(window.crypto&&crypto.subtle))throw new Error('Sync needs a secure (https) page.');
  const c=syCfg(),RP=`/repos/${encodeURIComponent(c.o)}/${encodeURIComponent(c.r)}`;
  prog('Checking the repository...');
  const info=await gh(RP,{repo:1});
  if(!info.private)throw new Error('That repository is public, and your reviews would be visible to everyone. Make it private first (GitHub: repo Settings, Danger Zone, Change visibility), then sync again.');
  const br=info.default_branch||'main',st=(await kvGet('syncstate'))||{};let base=st.base||{};const cache=st.cache||{};
  const persist=()=>kvSet('syncstate',{base,cache}).catch(()=>{});
  let asked=false,done=false;
  for(let attempt=0;attempt<4&&!done;attempt++){
   prog('Reading the repository...');
   let rem=await syRemote(RP,br);
   if(!rem){await gh(`${RP}/contents/${SYP}README.md`,{method:'PUT',body:{message:'Start MyCineList sync',content:u8b64(enc8.encode('MyCineList sync data. Keep this repository private.\n'))}});
    rem=await syRemote(RP,br);if(!rem)throw new Error('Could not start the sync repository.')}
   const R=rem.map;
   if(!Object.keys(R).some(p=>p!=SYP+'README.md')&&Object.keys(base).length)base={};
   prog('Comparing this device with the repository...');
   const L=await syLocal(cache),ops={pullR:[],pushR:[],delLR:[],delRR:[],pullK:[],pushK:[],delLK:[],delRK:[]};
   const ids=new Set(L.rev.keys());[...Object.keys(R),...Object.keys(base)].forEach(p=>{if(p.startsWith(SYP+'r/')&&p.endsWith('.json'))ids.add(syRid(p))});
   for(const id of ids){const rp=`${SYP}r/${pEnc(id)}.json`,e=L.rev.get(id),l=e?e.jsha:null,r=R[rp]||null,b=base[rp]||null;let a=plan3(l,r,b);
    if(a=='conflict'){let upd=0;
     try{upd=JSON.parse(dec8.decode(await gh(`${RP}/git/blobs/${r}`,{raw:1}))).updated||0}catch(x){}
     a=upd>(e.rec.updated||0)?'pull':'push';sum.conf++}
    if(a=='pull')ops.pullR.push(id);else if(a=='push')ops.pushR.push(id);else if(a=='delpull')ops.delLR.push(id);else if(a=='delpush')ops.delRR.push(id);
    else{ // already the same: remember it
     if(l&&r){base[rp]=r;for(const k of ['p','b']){const pp=`${SYP}${k}/${pEnc(id)}.img`;if(R[pp])base[pp]=R[pp];else delete base[pp]}}
     else if(!l&&!r){['r','p','b'].forEach(k=>delete base[`${SYP}${k}/${pEnc(id)}.${k=='r'?'json':'img'}`])}}}
   if(!asked&&ops.delLR.length>Math.max(3,L.rev.size*.25)){asked=true;
    const yes=await ask('Remove reviews from this device?',`Sync found ${ops.delLR.length} reviews that are no longer in the sync repo. Remove them here too? If you choose Keep, they are put back in the repo instead.`,'Remove them',true);
    if(!yes){ops.pushR.push(...ops.delLR);ops.delLR=[]}}
   const kp=new Set(L.keyed.keys());[...Object.keys(R),...Object.keys(base)].forEach(p=>{if(syKey(p)||p==SYP+'profile.json')kp.add(p)});
   for(const p of kp){const l=(L.keyed.get(p)||{}).sha||null,r=R[p]||null,b=base[p]||null;let a=plan3(l,r,b);if(a=='conflict')a=(p==SYP+'profile.json'&&!b)?'pull':'push'; /* a new device has only the default profile: take the one in the repo */
    const k=syKey(p);if(k&&a=='delpull'&&S.reviews.some(x=>x.tkey==k.key))a='push';
    if(a=='pull')ops.pullK.push(p);else if(a=='push')ops.pushK.push(p);else if(a=='delpull')ops.delLK.push(p);else if(a=='delpush')ops.delRK.push(p);
    else if(l&&r)base[p]=r;else if(!l&&!r)delete base[p]}
   /* 1. receive reviews */
   let n=0;const total=ops.pullR.length;
   await pool(ops.pullR,4,async id=>{const rp=`${SYP}r/${pEnc(id)}.json`,rec=JSON.parse(dec8.decode(await gh(`${RP}/git/blobs/${R[rp]}`,{raw:1})));rec.id=rec.id||id;
    const cc={u:rec.updated,hp:!!rec.hasPoster,hb:!!rec.hasBg,p:null,b:null};
    for(const k of ['p','b']){const pp=`${SYP}${k}/${pEnc(id)}.img`,want=k=='p'?rec.hasPoster:rec.hasBg,rs=R[pp];
     if(want&&rs){const same=(cache[id]||{})[k]===rs&&await dbGet('imgs',id+':'+k);if(!same)await dbPut('imgs',u82durl(await gh(`${RP}/git/blobs/${rs}`,{raw:1})),id+':'+k);cc[k]=rs;base[pp]=rs}
     else{await dbDel('imgs',id+':'+k);delete base[pp]}}
    await dbPut('reviews',rec);const i=S.reviews.findIndex(x=>x.id==id);if(i>=0)S.reviews[i]=rec;else S.reviews.push(rec);
    cache[id]=cc;base[rp]=R[rp];sum.down++;SY.dirty=true;prog(`Receiving ${++n} of ${total}...`)});
   /* 2. remove reviews deleted elsewhere */
   for(const id of ops.delLR){await deleteReview(id);delete cache[id];['r','p','b'].forEach(k=>delete base[`${SYP}${k}/${pEnc(id)}.${k=='r'?'json':'img'}`]);sum.delL++;SY.dirty=true}
   /* 3. receive pictures, scores, profile */
   let vch=0,bch=0,rch=0,pch=false;
   for(const p of ops.pullK){const k=syKey(p);if(k&&!S.reviews.some(x=>x.tkey==k.key))continue;
    const u=await gh(`${RP}/git/blobs/${R[p]}`,{raw:1});
    if(!k){try{const o=JSON.parse(dec8.decode(u));S.profile={...S.profile,name:o.name||S.profile.name,handle:o.handle||S.profile.handle,avatar:o.avatar||null,ui:o.ui?uiOut(uiNorm(o.ui)):S.profile.ui};try{lsSet('mcl.ui',JSON.stringify(S.profile.ui||{}))}catch(e){}applyUI();pch=true}catch(x){continue}}
    else if(k.kind=='v'){S.vp[k.key]=u82durl(u);vch++}else if(k.kind=='n'){S.bn[k.key]=u82durl(u);bch++}
    else{try{S.rt[k.key]=JSON.parse(dec8.decode(u));rch++}catch(x){continue}}
    base[p]=R[p];sum.k++;SY.dirty=true}
   for(const p of ops.delLK){const k=syKey(p);if(k){if(k.kind=='v'&&S.vp[k.key]){delete S.vp[k.key];vch++}else if(k.kind=='n'&&S.bn[k.key]){delete S.bn[k.key];bch++}else if(k.kind=='t'&&S.rt[k.key]){delete S.rt[k.key];rch++}}delete base[p];sum.k++;SY.dirty=true}
   if(vch)await kvSet('vposters',S.vp).catch(()=>{});if(bch)await kvSet('banners',S.bn).catch(()=>{});if(rch)await kvSet('ratings',S.rt).catch(()=>{});if(pch)await kvSet('profile',S.profile).catch(()=>{});
   await persist();
   /* 4. send what changed here, in one commit */
   const queue=[],dels=[],after=[];
   for(const id of ops.pushR){const e=L.rev.get(id),rp=`${SYP}r/${pEnc(id)}.json`;queue.push({path:rp,sha:e.jsha,u8:async()=>e.jb});after.push([rp,e.jsha]);
    for(const k of ['p','b']){const pp=`${SYP}${k}/${pEnc(id)}.img`,want=k=='p'?e.rec.hasPoster:e.rec.hasBg;
     if(want&&e[k]){if(R[pp]!==e[k])queue.push({path:pp,sha:e[k],u8:async()=>durl2u8(await dbGet('imgs',id+':'+k))});after.push([pp,e[k]])}
     else if(R[pp])dels.push(pp)}}
   for(const id of ops.delRR)['r','p','b'].forEach(k=>{const pp=`${SYP}${k}/${pEnc(id)}.${k=='r'?'json':'img'}`;if(R[pp])dels.push(pp)});
   for(const p of ops.pushK){const e=L.keyed.get(p);queue.push({path:p,sha:e.sha,u8:async()=>e.u8});after.push([p,e.sha])}
   for(const p of ops.delRK)if(R[p])dels.push(p);
   sum.up+=ops.pushR.length;sum.delR+=ops.delRR.length;sum.k+=ops.pushK.length+ops.delRK.length;
   if(queue.length||dels.length){
    let m=0;const seen=new Set();
    await pool(queue.filter(q=>R[q.path]!==q.sha),4,async q=>{if(seen.has(q.sha))return;seen.add(q.sha);const u=await q.u8();
     const r=await gh(`${RP}/git/blobs`,{method:'POST',body:{content:u8b64(u),encoding:'base64'}});if(r.sha!==q.sha)q.sha=r.sha;prog(`Sending ${++m} of ${queue.length}...`)});
    prog('Saving to the repository...');
    const tree=await gh(`${RP}/git/trees`,{method:'POST',body:{base_tree:rem.tree,tree:[...queue.filter(q=>R[q.path]!==q.sha).map(q=>({path:q.path,mode:'100644',type:'blob',sha:q.sha})),...dels.map(p=>({path:p,mode:'100644',type:'blob',sha:null}))]}});
    const cm=await gh(`${RP}/git/commits`,{method:'POST',body:{message:'MyCineList sync from '+(c.dev||devName()),tree:tree.sha,parents:[rem.head]}});
    try{await gh(`${RP}/git/refs/heads/${br}`,{method:'PATCH',body:{sha:cm.sha,force:false}})}
    catch(e){if(e.status==422||e.status==409){prog('Another device synced at the same moment. Trying again...');continue}throw e}
    after.forEach(([p,s])=>{base[p]=s});dels.forEach(p=>delete base[p]);ops.delRK.forEach(p=>delete base[p]);
    ops.delRR.forEach(id=>['r','p','b'].forEach(k=>delete base[`${SYP}${k}/${pEnc(id)}.${k=='r'?'json':'img'}`]))}
   await persist();done=true}
  if(!done)throw new Error('Another device was syncing at the same time. Please try again in a moment.');
  const txt=sumText(sum);syInfoSet({t:Date.now(),msg:txt});
  if(SY.dirty&&!($('sheet')&&$('sheet').classList.contains('on'))&&!/^#\/create/.test(location.hash)){SY.dirty=false;route()}
  return sum}
 catch(e){const i=syInfo();syInfoSet({...i,err:e.message||'Sync failed.',errAt:Date.now()});throw e}
 finally{SY.running=false}}
const sumText=s=>{const a=[];if(s.up)a.push('sent '+s.up+' review'+(s.up==1?'':'s'));if(s.down)a.push('received '+s.down+' review'+(s.down==1?'':'s'));if(s.delL)a.push('removed '+s.delL+' here');if(s.delR)a.push('removed '+s.delR+' from the repo');
 if(s.k)a.push(s.k+' picture/score update'+(s.k==1?'':'s'));if(s.conf)a.push(s.conf+' clash'+(s.conf==1?'':'es')+' settled by the newest edit');return a.length?'Done: '+a.join(', ')+'.':'Done. Everything was already up to date.'};
function autoSyncSoon(){if(!syReady()||!syCfg().auto||navigator.onLine===false)return;
 setTimeout(()=>{syncNow({quiet:1}).then(s=>{if(s&&(s.up||s.down||s.delL||s.delR||s.k))toast('Synced. '+sumText(s).replace(/^Done: /,''))}).catch(()=>{})},2500)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'&&syReady()&&syCfg().auto&&Date.now()-(syInfo().t||0)>600000)autoSyncSoon()});

 const sw=(k,c1,c2,on,t)=>`<button class="uisw ${on?'on':''}" data-acc="${k}" style="--c1:${c1};--c2:${c2}" aria-label="${esc(t)}"><i></i><span>${esc(t)}</span></button>`;
 const draw=()=>{const bgAcc=u.acc;
  pn.innerHTML=`<div class="gr"></div><h2 class="h2">Appearance</h2><p class="sub">Changes show at once. Your look is saved and travels with Sync (text size and layout stay on each device).</p>
  <div class="fld" style="margin-top:18px"><label class="lb">Mode</label>${seg('mode',Object.entries(MODES).map(([k,v])=>[k,v[0]]),u.mode)}</div>
  <div class="fld"><label class="lb">Accent colour</label><div class="uisws">${Object.entries(ACCS).map(([k,v])=>sw(k,v[1],v[2],bgAcc==k,v[0])).join('')}${sw('custom',u.a1,u.a2,bgAcc=='custom','Custom')}</div>
   <div class="row mt" id="cust" ${bgAcc=='custom'?'':'hidden'}><label class="sp lb" style="margin:0">Colour 1<input type="color" id="ca1" value="${u.a1}" style="display:block;width:100%;height:42px;margin-top:6px;border:0;background:none"></label><label class="sp lb" style="margin:0">Colour 2<input type="color" id="ca2" value="${u.a2}" style="display:block;width:100%;height:42px;margin-top:6px;border:0;background:none"></label></div></div>
  <div class="fld"><label class="lb">App font</label><select class="in" id="uf">${Object.entries(UIFONTS).map(([k,v])=>`<option value="${k}" ${u.font==k?'selected':''}>${esc(v[0])}</option>`).join('')}</select>
   <div class="sw" style="border-top:0;padding-bottom:0"><span class="t">Use it for headings too</span><button class="tgl ${u.hf?'on':''}" id="uhf" aria-label="Headings"></button></div></div>
  <div class="fld"><label class="lb">Text size (this device)</label>${seg('size',[['92','Small'],['100','Normal'],['112','Large'],['125','Extra']],dv.size)}</div>
  <div class="fld"><label class="lb">App background</label>${seg('bg',[['none','Default'],['color','Colour'],['image','Picture']],bgSel)}
   <div class="mt" id="bgc" ${bgSel=='color'?'':'hidden'}><input type="color" id="bgcol" value="${u.bgc}" style="width:100%;height:46px;border:0;background:none"></div>
   <div class="mt" id="bgi" ${bgSel=='image'?'':'hidden'}><div class="row"><button class="btn sp" id="bgpick">${ic('image')}${u.bgi?'Change picture':'Choose a picture'}</button>${u.bgi?'<button class="btn" id="bgrm">Remove</button>':''}</div>
    <div class="fld mt" style="margin-bottom:0"><label class="lb">Darkening (so text stays readable)</label><div class="sl"><input type="range" id="bgdim" min="30" max="95" step="1" value="${u.dim}"><output>${u.dim}</output></div></div></div></div>
  <div class="fld"><label class="lb">Layout (this device)</label>${seg('layout',[['auto','Automatic'],['phone','Always phone layout']],dv.layout)}
   <p class="hint">Use "Always phone layout" if the app looks like the wide PC version on your phone.</p></div>
  <button class="btn pri block mt2" id="udone">Done</button><button class="btn block mt" id="ureset">Reset to default look</button>`;
  bind()};
 const commit=()=>{saveUI(u);u=curUI()};
 const bind=()=>{
  pn.querySelectorAll('[data-seg]').forEach(g=>g.onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=g.dataset.seg,v=b.dataset.v;
   if(id=='mode'){u.mode=v;commit()}else if(id=='bg'){bgSel=v;u.bg=v;commit()}
   else if(id=='size'){devSet({size:v});dv=devGet();applyUI()}else if(id=='layout'){devSet({layout:v});dv=devGet();applyUI()}
   const sc=pn.scrollTop;draw();pn.scrollTop=sc});
  pn.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{u.acc=b.dataset.acc;commit();const sc=pn.scrollTop;draw();pn.scrollTop=sc});
  const a1=pn.querySelector('#ca1'),a2=pn.querySelector('#ca2');if(a1)a1.oninput=()=>{u.a1=a1.value;u.acc='custom';saveUI(u);u=curUI()};if(a2)a2.oninput=()=>{u.a2=a2.value;u.acc='custom';saveUI(u);u=curUI()};
  pn.querySelector('#uf').onchange=e=>{u.font=e.target.value;commit()};
  pn.querySelector('#uhf').onclick=e=>{u.hf=!u.hf;e.currentTarget.classList.toggle('on',u.hf);commit()};
  const bc=pn.querySelector('#bgcol');if(bc)bc.oninput=()=>{u.bgc=bc.value;u.bg='color';bgSel='color';saveUI(u);u=curUI()};
  const pick=async()=>{const d=await pickImage(900,.72,false);if(d){u.bgi=d;u.bg='image';bgSel='image';commit();const sc=pn.scrollTop;draw();pn.scrollTop=sc}};
  pn.querySelector('#bgpick').onclick=pick;
  const rm=pn.querySelector('#bgrm');if(rm)rm.onclick=()=>{u.bgi=null;u.bg='none';bgSel='none';commit();draw()};
  const dm=pn.querySelector('#bgdim');if(dm)dm.oninput=()=>{u.dim=dm.value;dm.parentElement.querySelector('output').textContent=dm.value;saveUI(u);u=curUI()};
  pn.querySelector('#udone').onclick=closeSheet;
  pn.querySelector('#ureset').onclick=()=>{u={...UI0};bgSel='none';commit();devSet({size:'100',layout:'auto'});dv=devGet();applyUI();draw();toast('Look reset')}};
 draw()};
(()=>{const st=document.createElement('style');st.textContent=`.uisws{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.uisw{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:14px;border:1px solid var(--ln);background:var(--pn);font-size:12px;color:var(--mu)}
.uisw i{display:block;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--c1),var(--c2))}
.uisw.on{border-color:var(--a1);color:var(--tx);box-shadow:0 0 0 2px color-mix(in srgb,var(--a1) 30%,transparent)}`;document.head.appendChild(st)})();

/* ---------- more card themes and fonts (added without touching the original drawing code) ---------- */
Object.assign(TH,{rosegold:'Rose gold',violet:'Violet haze',ember:'Ember',teal:'Deep teal',goldnoir:'Gold noir',steel:'Steel blue',duo:'Duotone',blueprint:'Blueprint grid',carbon:'Carbon weave',mint:'Mint (light)',sky:'Sky (light)',peach:'Peach (light)',lilac:'Lilac (light)'});
const XBG={
 rosegold:(c,H,h)=>{h.lin([[0,'#1a0d14'],[1,'#2d1420']],0,0,0,H);h.glow(W,0,W,'#ff9ec4');h.glow(0,H,W*.8,'#ffb88c')},
 violet:(c,H,h)=>{h.lin([[0,'#0d0820'],[1,'#1c0f3d']],0,0,0,H);h.glow(W*.8,H*.1,W,'#a855f7');h.glow(0,H*.8,W*.8,'#6366f1')},
 ember:(c,H,h)=>{h.lin([[0,'#150805'],[1,'#2a0f08']],0,0,0,H);h.glow(W*.5,H,W*1.1,'#ff6a00');h.glow(W,0,W*.7,'#ff2d2d')},
 teal:(c,H,h)=>{h.lin([[0,'#021a1a'],[1,'#04302f']],0,0,0,H);h.glow(0,0,W,'#14b8a6');h.glow(W,H,W*.8,'#0891b2')},
 goldnoir:(c,H,h)=>{h.lin([[0,'#0c0a06'],[1,'#1c1509']],0,0,0,H);h.glow(W,0,W,'#f5c542');h.glow(0,H,W*.6,'#b8860b')},
 steel:(c,H,h)=>{h.lin([[0,'#0d1520'],[1,'#1b2a3d']],0,0,W*.5,H);h.glow(W,0,W*.9,'#5b8bd6')},
 duo:(c,H,h)=>{h.lin([[0,'#0b1d52'],[1,'#4a1257']],0,0,W,H);h.glow(W,H,W,'#ff4fa3');h.glow(0,0,W*.8,'#2f8cff')},
 blueprint:(c,H,h)=>{h.solid('#0a2540');c.strokeStyle='rgba(120,180,255,.14)';c.lineWidth=2;for(let x=0;x<=W;x+=60){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=0;y<=H;y+=60){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}
  c.strokeStyle='rgba(120,180,255,.1)';c.lineWidth=4;for(let x=0;x<=W;x+=300){c.beginPath();c.moveTo(x,0);c.lineTo(x,H);c.stroke()}for(let y=0;y<=H;y+=300){c.beginPath();c.moveTo(0,y);c.lineTo(W,y);c.stroke()}h.glow(W/2,0,W,'#3b82f6')},
 carbon:(c,H,h)=>{h.solid('#0e0f12');c.fillStyle='rgba(255,255,255,.045)';for(let y=0;y<H;y+=16)for(let x=((y/16)%2)*8;x<W;x+=16)c.fillRect(x,y,8,8);h.glow(W,0,W*.8,'#6b7280')},
 mint:(c,H,h)=>{h.lin([[0,'#e8f8ef'],[1,'#cdeede']],0,0,0,H);h.glow(W,0,W*.9,'#7ad9a7')},
 sky:(c,H,h)=>{h.lin([[0,'#e8f3fd'],[1,'#cfe3f7']],0,0,0,H);h.glow(0,0,W*.9,'#8ec5ff')},
 peach:(c,H,h)=>{h.lin([[0,'#fff0e6'],[1,'#fbd9c6']],0,0,0,H);h.glow(W,H,W*.9,'#ffb48a')},
 lilac:(c,H,h)=>{h.lin([[0,'#f0eafc'],[1,'#ddd1f6']],0,0,0,H);h.glow(0,H,W*.9,'#b9a2f0')}};
const XLIGHT={mint:{tx:'#12281d',mu:'#43594c',line:'#7fb99a'},sky:{tx:'#14253a',mu:'#455a72',line:'#7aa6d6'},peach:{tx:'#3a2014',mu:'#6b4a3a',line:'#d9a384'},lilac:{tx:'#241a3a',mu:'#554a70',line:'#a99ad6'}};
(()=>{const _bg=drawBG;drawBG=function(c,H,T,bc){const f=XBG[T.k];if(!f)return _bg(c,H,T,bc);
  const lin=(a,x0,y0,x1,y1)=>{const g=c.createLinearGradient(x0,y0,x1,y1);a.forEach(([o,col])=>g.addColorStop(o,col));c.fillStyle=g;c.fillRect(0,0,W,H)};
  const glow=(x,y,r,col)=>{const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col+'66');g.addColorStop(1,col+'00');c.fillStyle=g;c.fillRect(0,0,W,H)};
  const solid=col=>{c.fillStyle=col;c.fillRect(0,0,W,H)};
  c.save();f(c,H,{lin,glow,solid});c.restore()};
 const _th=theme;theme=function(){const t=_th(),x=XLIGHT[t.k];if(!x)return t;
  return{...t,light:true,tx:x.tx,mu:x.mu,line:x.line,ln:'rgba(60,45,20,.22)',cb:'rgba(60,45,20,.07)',cs:'rgba(60,45,20,.30)',pn:'rgba(255,250,240,.7)',bs:'rgba(60,45,20,.35)',gl:'rgba(90,79,63,.45)'}}})();
const XFONTS={Nunito:['Nunito (soft sans)','Nunito,'+FF,'Nunito'],Inter:['Inter (neutral)','Inter,'+FF,'Inter'],Raleway:['Raleway (stylish)','Raleway,'+FF,'Raleway'],Quicksand:['Quicksand (rounded)','Quicksand,'+FF,'Quicksand'],JosefinSans:['Josefin Sans (retro)','"Josefin Sans",'+FF,'Josefin Sans'],
 Cormorant:['Cormorant Garamond (classic)','"Cormorant Garamond",Georgia,serif','Cormorant Garamond'],Baskerville:['Libre Baskerville (book)','"Libre Baskerville",Georgia,serif','Libre Baskerville'],RobotoSlab:['Roboto Slab (sturdy)','"Roboto Slab",Georgia,serif','Roboto Slab'],
 Bebas:['Bebas Neue (poster caps)','"Bebas Neue",Impact,sans-serif','Bebas Neue'],Abril:['Abril Fatface (headline)','"Abril Fatface",Georgia,serif','Abril Fatface'],Pacifico:['Pacifico (brush script)','Pacifico,"Segoe Script",cursive','Pacifico'],
 Marker:['Permanent Marker (marker)','"Permanent Marker","Segoe Print",cursive','Permanent Marker'],Indie:['Indie Flower (casual)','"Indie Flower","Segoe Print",cursive','Indie Flower'],CourierPrime:['Courier Prime (script)','"Courier Prime","Courier New",monospace','Courier Prime']};

(()=>{const _fr=fontReady;fontReady=function(key){const k=key||L('rfont');if(XFONTS[k])ensureFont(XFONTS[k][2]);return _fr(key)}})();
